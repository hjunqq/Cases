model:
  name: HSTAR
  language: fortran
  implementation:
    id: hstar-fem90-linux-ifx
    version: 2025.07 source snapshot (73k lines, 17 compiled units)
    provenance: Fortran 90; single-binary console solver linking Intel MKL PARDISO,
      VSL and the RCI trust-region least-squares solver, with a GiD post-processing
      writer.
  scientific_reference_version: null
inputs: []
outputs:
  primary:
  - name: DISPLACEMENT
    unit: m
    description: Displacement vector at every mesh node of the solid medium - the
      concrete dam or lock body together with its soil and rock foundation. This is
      the quantity dam monitoring instruments (plumb lines, invar wires, geodetic
      targets, GNSS) measure directly, and the quantity every HSTAR analysis is judged
      by.
    emitted_in: <probn>.flavia.res, result block 'DISPLACEMENT'
    validation_rank: 1
  - name: TEMPERATURE
    unit: degC
    description: Temperature of the solid medium - mass concrete and the soil and
      rock foundation - at mesh nodes, comparable with embedded thermometer strings.
    emitted_in: <probn>.flavia.res, result block 'TEMPERATURE'
    validation_rank: 2
  - name: PORE-PRESSURE
    unit: Pa
    description: Pore water pressure in the soil and rock skeleton - the groundwater
      pressure in the foundation, the embankment and the grout curtain - comparable
      with piezometer readings.
    emitted_in: <probn>.flavia.res, result block 'PORE-PRESSURE'
    validation_rank: 3
  - name: WATER-HEAD
    unit: m
    description: Hydraulic head of the groundwater in the soil and rock medium, i.e.
      the phreatic surface elevation and the seepage potential field, comparable with
      observation-well water levels.
    emitted_in: <probn>.flavia.res, result block 'WATER-HEAD'
    validation_rank: 4
  - name: modal_frequency
    unit: Hz
    description: Natural vibration frequency of the dam-foundation system - the concrete
      structure coupled to its soil and rock foundation and, when the added-mass or
      interface model is active, to the reservoir water - comparable with ambient-vibration
      or forced-vibration modal identification.
    emitted_in: <probn>.chk, records 'order= .. omega= .. freq= .. period= ..'; base
      mode also in <probn>.omg
    validation_rank: 5
  - name: acceleration
    unit: m s-2
    description: Acceleration of the solid medium - the dam body and its soil and
      rock foundation - during seismic shaking, comparable with structural accelerograph
      records.
    emitted_in: <probn>.flavia.res, result blocks 'acceleration' and 'acceleration_ab'
    validation_rank: 6
  - name: STRESS
    unit: Pa
    description: Cauchy stress tensor in the solid medium - concrete and the soil
      and rock foundation - averaged to mesh nodes, comparable with stress-meter and
      strain-gauge derived stresses.
    emitted_in: <probn>.flavia.res, result block 'STRESS' (SIGXX SIGYY SIGXY SIGZZ
      in 2-D)
    validation_rank: 7
  - name: factor_of_safety
    unit: '-'
    description: Sliding-stability factor of safety of the structure on its declared
      failure surface - a dam block on its soil and rock foundation contact, or a
      soil slope with an unknown slip surface found by strength reduction.
    emitted_in: <probn>.chk safety-factor records (kstab path) or, for strength reduction,
      the last converged step
    validation_rank: 8
  secondary:
  - name: velocity
    unit: m s-1
    description: Velocity of the solid medium at mesh nodes during a dynamic analysis.
    emitted_in: <probn>.flavia.res, result block 'velocity'
  - name: PRINCIPALSTRESS
    unit: Pa
    description: Principal stresses and their directions in the solid medium.
    emitted_in: <probn>.flavia.res, result block 'PRINCIPALSTRESS'
  - name: PLASTICSTRAIN
    unit: '-'
    description: Equivalent plastic strain in the solid medium, marking the developing
      failure zone.
    emitted_in: <probn>.flavia.res, result block 'PLASTICSTRAIN'
  - name: Yield
    unit: '-'
    description: Yield indicator per node - whether the constitutive law is on its
      yield surface.
    emitted_in: <probn>.flavia.res, result block 'Yield'
  - name: tofor
    unit: N
    description: Total external nodal force vector assembled for the current step.
    emitted_in: <probn>.flavia.res, result block 'tofor'
  - name: uplift-PRESSURE
    unit: Pa
    description: Uplift pressure applied on the declared foundation contact surfaces.
    emitted_in: <probn>.flavia.res, result block 'uplift-PRESSURE'; binary state in
      <probn>.upf
  - name: reliability_index
    unit: '-'
    description: First-order reliability index beta of the sliding limit state; failure
      probability is Phi(-beta).
    emitted_in: <probn>.chk, records containing 'beta='
  - name: equilibrium_residual_ratio
    unit: '-'
    description: Norm of the out-of-balance force divided by the norm of the external
      force at the last iteration.
    emitted_in: <probn>.chk, records 'ratio for residu norm='
known_issues:
- id: dt_001
  symptom: '"The run prints a full converged Newton history and ''***********RESTART
    FILE IS UPDATED!*******'', then dies with ''forrtl: severe (24): end-of-file during
    read, unit -4, file /proc/<pid>/fd/0'' and a non-zero exit code. The .flavia.res
    on disk is complete and correct."'
  remedy: Feed stdin. tools/run_hstar.py does this automatically - default_stdin()
    reads winit and submodel from the case's own .glb and sends '1 1.0 1.0' (vdimn=1,
    no rescaling of the written initial stress) followed by blank lines for any pause.
    Value answers must come first so a blank line is never consumed by a value read.
    For submodel < 0 supply the sub-mesh group and element lists with --stdin-file.
    Alternatively set winit=0 in .glb if you do not need the .inw file.
- id: dt_002
  symptom: '"Compilation fails on the first unit with errors about FORM=''BINARY''
    being an invalid specifier, an unknown PAUSE statement, or an unresolved TIME()
    reference."'
  remedy: Build with Intel ifx or ifort plus MKL. On this host, /opt/intel/oneapi/compiler/2025.3
    (ifx 2025.3.3) and /opt/intel/oneapi/mkl/latest. Use the dependency-ordered build
    in docs/s0_overview_and_build.md; compiling alphabetically fails because every
    unit uses the global_var module defined in Global.f90.
- id: dt_003
  symptom: '"forrtl: severe (24): end-of-file during read on unit 1, 2, 3, 4, 5, 9
    or 21, very early in the run, often right after the first echo of the .glb header."'
  remedy: Never hand-assemble a case. Copy a working one with tools/build_case_from_template.py
    --template <name> --dest <dir>, then edit values in place. If you must debug an
    existing case, compare its record sequence against docs/input_preparation.md section
    3 and against the same file in cases/static.
- id: dt_004
  symptom: Either an end-of-file during the coordinate/element read, or a SIGSEGV
    inside the stiffness assembly, or - worst - a run that completes with a structure
    smaller than the mesh file describes.
  remedy: Run tools/build_mesh_files.py --case <dir> --check before every run; it
    compares record counts against npoin/nelem, counts elements per group, and checks
    the node count per element against the declared element index. write_mesh() keeps
    all of these in sync automatically.
- id: dt_005
  symptom: The run completes but the echoed control parameters are visibly wrong -
    a solver name where an integer should be, nblks equal to a tolerance, or type_problem
    echoed as a number.
  remedy: Count the tokens on the control line against the field list in docs/input_preparation.md
    section 3.1. tools/_hstar_io.GlbDoc._bind raises a specific error naming the record
    and the expected fields when a line is short, so simply loading the case with
    any build_* tool detects it.
- id: dt_006
  symptom: A perfectly converged run whose displacements are a million times too large
    or too small, or whose stresses are in the wrong decade. Nothing in the log complains.
  remedy: Use SI everywhere. tools/build_material_file.set_solid rejects E outside
    1e3..1e13 Pa, density outside 1..2e4 kg/m3 and nu outside (-1, 0.5); tools/build_loads
    rejects gravity outside 0..100 m/s2; tools/validate_results.plausibility screens
    every output stream against an order-of-magnitude band after the run.
- id: dt_007
  symptom: 'Block 1 runs and writes output, then the run dies with "forrtl: severe
    (24): end-of-file during read" at the start of block 2.'
  remedy: When you change nblks, extend all three files together. tools/build_analysis_control
    .write_man and .write_sol take the block count from .glb and emit one group per
    block; tools/build_boundary_conditions.write_pre refuses a blocks list whose length
    is not nblks.
- id: dt_008
  symptom: Prescribed pressure or head boundary conditions produce pore pressures
    roughly 1000 times smaller than expected; the seepage field looks almost uniform.
  remedy: Use 9800 N/m3. tools/build_boundary_conditions.write_pre raises when a pressure
    DOF (ifixvar 7, 8 or 9) is given a gamawx strictly between 0 and 1000.
- id: dt_009
  symptom: '"The log reaches '' in static_U**'', prints ''tcurvegravity='', then ''forrtl:
    severe (174): SIGSEGV, segmentation fault occurred'' with an all-Unknown traceback."'
  remedy: Run tools/build_mesh_files.py --check and tools/build_reinforcement.py --describe
    first; both report the specific inconsistency. Start from a template listed in
    tools/_hstar_io.TEMPLATES - all eleven were confirmed to parse, and ten of them
    to run to EXIT=0, on 2026-08-26. To debug further, rebuild with "ifx -O0 -g -traceback
    -check all" per docs/s0_overview_and_build.md.
- id: dt_010
  symptom: Raising or lowering the reservoir changes the results far less than expected,
    or not at all.
  remedy: Use tools/build_loads.set_reservoir_level(), which writes both. Then prove
    the change took effect by re-running and diffing the DISPLACEMENT stream - see
    dt_024 for the procedure.
- id: dt_011
  symptom: Water load about 9810 times too large; the structure displaces metres and
    the Newton loop either diverges or converges to a nonsensical deformed shape.
  remedy: Pick one convention - either head in metres with fact = 9810, or pressure
    in pascals with fact = 1.0 - and check that p1 * fact equals the expected pressure
    at cor1. tools/build_loads.py --describe prints cor0/cor1/p0/p1/fact with their
    units.
- id: dt_012
  symptom: An excavation or demolition step produces far less heave / stress redistribution
    than expected; the remaining structure barely moves.
  remedy: Use -1 for the block in which material is removed, and 0 for later blocks.
    tools/build_staged_construction.py --appear rejects any value other than 1, 0
    or -1 and prints the legend.
- id: dt_013
  symptom: A transient thermal run reaches steady state within a handful of steps,
    or the temperature field barely changes over the whole simulation - a factor of
    3600 either way.
  remedy: Decide the time unit once (seconds for dynamics, days for mass-concrete
    thermal) and use it for ditime, for the HEAT alfa, for the pipe-cooling time_cooling,
    and for every time curve in .loa. Record the choice in the run metadata.
- id: dt_014
  symptom: Thermal stresses two orders of magnitude too large; the temperature field
    sits around 300 instead of around 20.
  remedy: Convert to degrees Celsius. tools/build_thermal.write_tem rejects prescribed
    temperatures outside -100..500 degC; tools/validate_results screens the TEMPERATURE
    output stream against -60..200 degC.
- id: dt_015
  symptom: A consolidation run converges normally but the PORE-PRESSURE output is
    zero everywhere, and the displacements match a drained analysis.
  remedy: Change the group's element index to the coupled counterpart (Q4 -> Q4C4
    = 16, B8 -> B8C8 = 18, ...) with tools/build_mesh_files.set_group_field(case,
    g, "index", 16). tools/build_seepage.set_coupled emits an explicit warning listing
    the offending groups.
- id: dt_016
  symptom: A transient seepage or consolidation run reports the initial condition
    essentially unchanged at every step; pore pressure never dissipates.
  remedy: Convert with k = K * mu / (rho_w * g) or simply enter the conductivity directly.
    Sanity check - sand 1e-2..1e-5 m/s, silt 1e-5..1e-8, clay 1e-8..1e-11, sound rock
    1e-7..1e-11.
- id: dt_017
  symptom: A contact run that used to work crashes or produces nonsensical contact
    forces immediately after the mesh was refined or the contact pairs renumbered.
  remedy: Set restart_ctt = 0, or clear the file, before the first run on a changed
    mesh - tools/build_contact_joints.py --clear-state does exactly that. Reinstate
    restart_ctt only once the pair numbering is stable.
- id: dt_018
  symptom: Either negative (interpenetrating) gaps in the .ogw / .gdm output with
    a physically impossible amount of closure, or PARDISO reporting tiny/zero pivots
    and the Newton loop stalling.
  remedy: Scale kn to roughly 1e2..1e3 times (adjacent E) / (representative element
    size), and ks to about kn/10. Change kn by one order of magnitude at a time and
    check that the converged normal gap and the number of state iterations both stabilise.
- id: dt_019
  symptom: Peak accelerations and high-frequency content are visibly lower than a
    reference solution; the response looks smooth and the peak arrives late.
  remedy: Use beeta1 = 0.5, beeta2 = 0.25 for dynamics unless algorithmic damping
    is deliberate. tools/build_dynamic_seismic.set_newmark also rejects any pair with
    beta < (gamma + 1/2)^2 / 4, which is only conditionally stable.
- id: dt_020
  symptom: With type_solver='EXPLICIT' the displacements grow by orders of magnitude
    every few steps and become NaN within a few hundred steps.
  remedy: Estimate dt_crit = L_min / c, with c = sqrt(E(1-nu)/(rho(1+nu)(1-2nu))),
    and use 0.5..0.8 of it for ditime. Or switch to the implicit Newmark path (type_solver='PARDISO',
    type_problem='F'), which is unconditionally stable at gamma=0.5, beta=0.25.
- id: dt_021
  symptom: Two MAT_DE runs of the same slope report different factors of safety, and
    the difference tracks the maximum-iteration setting rather than anything physical.
  remedy: Fix miter (>= 200) and toler_force across every run you intend to compare,
    and report both alongside the FoS. Use a fine reduction march (nstep >= 100) so
    the last converged step brackets the true value tightly. tools/build_stability_analysis.set_strength_reduction
    sets miter explicitly and says so in its return value.
- id: dt_022
  symptom: relis=1 produces a reliability index but the value does not respond to
    changing the strength parameters, or beta is reported as an implausibly round
    number.
  remedy: Populate .sto before setting relis=1. tools/build_reliability.enable_form
    refuses to turn FORM on when .sto is empty and says why.
- id: dt_023
  symptom: The inversion converges cleanly but returns a modulus that is off by about
    three orders of magnitude, and the reported residual is small.
  remedy: Convert observations to model units before writing .obs. Then sanity-check
    the recovered parameter against docs/s3_materials_and_constitutive.md - a concrete
    modulus outside 1e10..3e10 Pa or a rock modulus outside 1e9..3e10 Pa is a unit
    problem, not a discovery.
- id: dt_024
  symptom: An edge / surface pressure is present in .loa with a sensible magnitude,
    but changing it - even setting its multiplier to zero - leaves the displacement
    field bit-identical.
  remedy: Prove every load contributes, by perturbation - set its multiplier to zero,
    re-run, and diff the DISPLACEMENT stream. If nothing changes, check (a) appear_process
    for the parent element's group in that block, (b) that the load's time curve has
    a non-zero increment over the step, and (c) that the load is declared in the block
    being run (runblks in inp).
- id: dt_025
  symptom: A verification against an analytic stress solution shows an error of exactly
    half an element's worth of stress at the outermost rows of nodes, while the interior
    matches perfectly.
  remedy: Compare interior nodes, or compare the domain mean. On this KI's 20-layer
    column benchmark the interior sigma_yy matches -rho*g*(H-y) to 0.0 percent while
    the two boundary rows are offset by exactly rho*g*dy/2 = 5886 Pa - the averaging,
    not an error. validate_results.compare_benchmark deliberately compares the MEAN
    for this reason.
- id: dt_026
  symptom: A post-processing script looking for 'acceleration_absolute', 'flow_charge'
    or 'Excess_PORE-PRESSURE' finds nothing, even though the corresponding gid_* flag
    is on.
  remedy: Match on the truncated spelling, or use tools/parse_outputs.py, whose RESULT_UNITS
    table carries both spellings so no stream ever reports unit "unknown".
- id: dt_027
  symptom: A thermal or non-linear case is reported as "off" because ntsmat/nthmat
    (or nmass/nsmat/nhmat/nqmat) are 999, or the run is unexpectedly slow because
    they were set to 0.
  remedy: Leave them at the template's values unless you are deliberately trading
    cost against accuracy. Use 0 for strongly non-linear material or contact, larger
    values for a nearly linear problem. tools/build_thermal.py --describe spells out
    the meaning of each value and reports the number of T-field groups.
- id: dt_028
  symptom: '"A Python tool raises ''UnicodeDecodeError: utf-8 codec can''t decode
    byte 0xb2 ...'' when opening <probn>.mat, <probn>.loa or <probn>.tem."'
  remedy: Open HSTAR text files with encoding="latin-1", which is byte-transparent
    and round-trips the GBK bytes untouched on write. Every tool in this KI does this
    through tools/_hstar_io.read_lines / write_lines. Do NOT "fix" the files by transcoding
    them - that changes their byte length and, for CRLF files, their line endings.
- id: dt_029
  symptom: A solver, problem type or load type that was clearly set in .glb is ignored
    and HSTAR takes a different branch - typically falling back to the default solver.
  remedy: Keep character keywords away from end-of-line, or normalise the whole file
    to one line ending consistently. tools/_hstar_io.GlbDoc.set refuses to write a
    character field as the last token of a CRLF line and explains why.
- id: dt_030
  symptom: '"A tool raises ValueError: invalid literal for int() with base 10: ''337*0''
    or reads type_problem as \"''Q''\" including the quotes."'
  remedy: Tokenise the way Fortran does. tools/_hstar_io.raw_tokens handles quotes,
    commas, tabs, a trailing '!' annotation and a terminating '/', and tools/_hstar_io.expand
    expands repeat counts. Every KI tool goes through tokens() = expand(raw_tokens(...)).
- id: dt_031
  symptom: PARDISO reports zero or tiny pivots, or returns an error code, on a case
    whose PROFILE solution is fine.
  remedy: Use mtype = -2, which is what every shipped case uses, and 11 only when
    nonsym /= 0. tools/build_analysis_control.write_sol rejects any other value and
    names the three.
- id: dt_032
  symptom: A second run of the same case produces different results from the first,
    or starts mid-way through the load history.
  remedy: Always run from a copy. tools/run_hstar.py copies the case into a workspace
    and runs with cwd=workspace, so the case directory is never mutated. If you must
    re-run in place, set restart = 0 with tools/_hstar_io.set_inp and delete the stale
    .rtt.
- id: dt_033
  symptom: '"ModuleNotFoundError: No module named ''ki_tools_common'' when a tool
    tries to import all_metrics, load_daily_forcing, lookup_hwsd or detect_binary_type."'
  remedy: Every tool in this KI wraps the import in try/except and falls back to tools/_local_metrics.py,
    which provides all_metrics(obs, sim) with the identical signature. Nothing needs
    changing when the shared library becomes available - the preferred import is tried
    first. Note also that the forcing/soil/land-cover helpers are not applicable to
    HSTAR at all - it is a structural FEM solver with no meteorological driver.
