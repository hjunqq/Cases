# HONESTY NOTE, read this before using any band below.
#
# Structural/geotechnical FEM of hydraulic structures has no equivalent of Moriasi's
# discharge table: there is no field-wide, citable NSE/KGE-style pass band for dam
# displacement, temperature, pore pressure, modal frequency or factor of safety. What the
# literature reports is the accuracy ACHIEVED in specific studies on specific structures.
#
# Exactly ONE numeric band below is backed by a fetched paper (dam radial displacement,
# MAE in mm). Every other band is `null` -- NOT a guess. The papers that would have closed
# those gaps were resolvable but not downloadable from this network (Elsevier, MDPI, IOP,
# Hindawi and Wiley all return 403 or an Akamai interstitial); they are listed under
# `deferred_paywalled` and in docs/paywalled_targets.json rather than silently dropped.

