# dag.yaml — HSTAR (FEM90 kernel), locked 7-block template v3.5
#
# HAND-AUTHORED, not machine-generated: `python -m ki_dag_generator --model HSTAR` cannot run
# on this host because it resolves ki_path/binary_path from
# /mnt/disk1/Hydrocraft_server/hydrocraft.db, which does not exist here
# (sqlite3.OperationalError: no such table: models). Every field below was taken from the
# source read described in docs/capabilities.md and confirmed against runs of the compiled
# binary on 2026-08-26.
template_version: "3.5"

identity:
  model_id: "HSTAR"
  scientific_reference_version: >-
    FEM90 finite-element kernel of M. Pastor, T. Li and P. Mira (1997), as extended by the
    Chinese hydraulic-structures community through 2025-07 (source markers in Fem.f90,
    Global.f90, Material.f90, Output.f90)
  implementation:
    id: "hstar-fem90-linux-ifx"
    version: "2025.07 source snapshot (73k lines, 17 compiled units)"
    provenance: >-
      Fortran 90; single-binary console solver linking Intel MKL PARDISO, VSL and the RCI
      trust-region least-squares solver, with a GiD post-processing writer.
  ki_class: "forward_model"
  is_family_dag: false
  language: "fortran"
  license: "proprietary / research group internal"
  repo_url: ""

boundary:
  scope_in:
    - "Static and quasi-static stress and displacement of hydraulic structures"
    - "Implicit (Newmark) and explicit dynamic response, including earthquake input"
    - "Modal extraction, response spectrum and steady-state frequency-domain response"
    - "Transient and steady heat conduction in mass concrete, including embedded pipe cooling"
    - "Steady and transient groundwater seepage, with a free-surface (phreatic) boundary"
    - "Biot u-p and u-pw coupled consolidation of the soil and rock skeleton"
    - "Node-pair contact, Goodman joints and thin-layer interfaces"
    - "Sliding stability: limit-state safety factor, strength reduction and rigid-block kinematics"
    - "FORM component and system reliability of the sliding limit state"
    - "Parameter inversion from monitoring data (Levenberg-Marquardt, trust region, rigid/elastic split)"
    - "Staged construction and excavation by element birth and death"
    - "Reservoir-structure interaction by Westergaard added mass and by explicit interface elements"
  scope_out:
    - "Hydrological rainfall-runoff generation: HSTAR takes a reservoir level, it does not compute one"
    - "Free-surface hydrodynamics of the reservoir; the water is an added mass or a pressure boundary"
    - "Chemical degradation, alkali-silica reaction and reinforcement corrosion kinetics"
    - "Fracture propagation with explicit crack tracking; cracking is smeared or damage-based"
    - "Meteorological forcing of any kind; thermal boundary conditions are prescribed by the analyst"
  spatial: "3-D"
  temporal: "event"
  closure: "both"
  notes: >-
    Momentum closure is the discrete equilibrium statement ||R|| / ||F_ext|| written to
    <probn>.chk every Newton iteration; it is the model's own conservation check and the
    structural analogue of a mass balance. Energy closure applies to the heat-conduction
    field when a T-field group is present. Mass closure applies to the seepage field. There
    is no closed reservoir water budget: the reservoir enters only as a boundary pressure or
    an added mass.

inputs:
  forcing:
    - category: "hydraulic"
      name: "reservoir_water_level"
      unit: "m"
      source_kind: "user_provided"
      model_input_format: "cor0 on the water edge-load record of <probn>.loa, and water_level(1:nblks) in <probn>.glb"
      notes: "Elevation of the reservoir surface; drives the hydrostatic pressure profile on the upstream face."
    - category: "seismic"
      name: "base_acceleration_time_history"
      unit: "m s-2"
      source_kind: "user_provided"
      model_input_format: "a SEISMIC time curve in <probn>.loa referenced by earthquake_curve(1:ndimn) in <probn>.man"
    - category: "thermal"
      name: "boundary_temperature"
      unit: "degC"
      source_kind: "user_provided"
      model_input_format: "prescribed-temperature and convection-edge records in <probn>.tem"
    - category: "thermal"
      name: "cooling_water_temperature"
      unit: "degC"
      source_kind: "user_provided"
      model_input_format: "water_curve on the HEAT material record of <probn>.mat, pipe records in <probn>.tem"
  parameters:
    - category: "elastic"
      name: "youngs_modulus"
      unit: "Pa"
      source_kind: "calibrated"
      model_input_format: "token 5 of the SOLID line in <probn>.mat"
    - category: "elastic"
      name: "poissons_ratio"
      unit: "-"
      source_kind: "default"
      model_input_format: "token 6 of the SOLID line in <probn>.mat"
    - category: "elastic"
      name: "mass_density"
      unit: "kg m-3"
      source_kind: "default"
      model_input_format: "token 2 of the SOLID line in <probn>.mat"
    - category: "thermal"
      name: "thermal_expansion_coefficient"
      unit: "degC-1"
      source_kind: "default"
      model_input_format: "token 7 of the SOLID line in <probn>.mat"
    - category: "thermal"
      name: "thermal_diffusivity"
      unit: "m2 per model time unit"
      source_kind: "calibrated"
      model_input_format: "alfa(1:ndimn) on the HEAT record of <probn>.mat"
    - category: "strength"
      name: "cohesion"
      unit: "Pa"
      source_kind: "calibrated"
      model_input_format: "CLASSICALEP / GOODMAN sub-record of <probn>.mat"
    - category: "strength"
      name: "friction_angle"
      unit: "degree"
      source_kind: "calibrated"
      model_input_format: "CLASSICALEP MC/DP or GOODMAN sub-record of <probn>.mat"
    - category: "strength"
      name: "tensile_strength"
      unit: "Pa"
      source_kind: "calibrated"
      model_input_format: "ftcrack on the crack/bond record of <probn>.glb, and GOODMAN sub-record"
    - category: "interface"
      name: "joint_normal_stiffness"
      unit: "Pa m-1"
      source_kind: "calibrated"
      model_input_format: "kn on the GOODMAN sub-record of <probn>.mat"
    - category: "interface"
      name: "joint_shear_stiffness"
      unit: "Pa m-1"
      source_kind: "calibrated"
      model_input_format: "ks on the GOODMAN sub-record of <probn>.mat"
    - category: "hydraulic"
      name: "hydraulic_conductivity"
      unit: "m s-1"
      source_kind: "calibrated"
      model_input_format: "permiability(1:ndimn) on the FLUID phase record of <probn>.mat"
    - category: "geometry"
      name: "beam_section_properties"
      unit: "m2 and m4"
      source_kind: "user_provided"
      model_input_format: "Aera J Iy Iz on the GEOMETRY record of <probn>.mat"
  initial_conditions:
    - category: "stress"
      name: "initial_stress_field"
      unit: "Pa"
      source_kind: "derived"
      model_input_format: "<probn>.ini read when ninit /= 0; written to <probn>.inw when winit /= 0"
    - category: "state"
      name: "contact_state"
      unit: "-"
      source_kind: "derived"
      model_input_format: "unformatted <probn>.ctt, re-read when restart_ctt /= 0"
    - category: "state"
      name: "restart_state"
      unit: "-"
      source_kind: "derived"
      model_input_format: "unformatted <probn>.rtt, read when restart /= 0 on line 2 of inp"
  boundary_conditions:
    - category: "kinematic"
      name: "prescribed_variable_sets"
      unit: "m, degC or Pa depending on the DOF"
      source_kind: "user_provided"
      model_input_format: "<probn>.pre, one complete group of sets per load block"
    - category: "mechanical"
      name: "gravity_body_force"
      unit: "m s-2 and direction cosines"
      source_kind: "default"
      model_input_format: "gravy factg(1:ndimn) factf(1:ndimn) record of <probn>.loa"
    - category: "mechanical"
      name: "surface_and_point_loads"
      unit: "Pa and N"
      source_kind: "user_provided"
      model_input_format: "edge-load and point-load blocks of <probn>.loa"
    - category: "mechanical"
      name: "uplift_pressure"
      unit: "Pa"
      source_kind: "derived"
      model_input_format: "upliftin in <probn>.glb, per-group uplift_ic, binary <probn>.upf"
    - category: "control"
      name: "construction_sequence"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "APPEAR_PROCESS and MATNO_PROCESS matrices in <probn>.glb"
    - category: "control"
      name: "analysis_type_selector"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "type_problem / type_solver / type_load / type_nl record of <probn>.glb"
    - category: "control"
      name: "degree_of_freedom_set"
      unit: "-"
      source_kind: "user_provided"
      model_input_format: "mdofn, lmdofn(1:mdofn) and order_time_mdofn(1:mdofn) of <probn>.glb"
    - category: "control"
      name: "increment_and_step_schedule"
      unit: "s"
      source_kind: "user_provided"
      model_input_format: "<probn>.man, one record group per load block"

processes:
  modules:
    - name: "ElementLibrary"
      role: "process_solver"
      brief: "Shape functions, Gauss integration and 26 element types (Elements.f90 kinddefine)."
    - name: "ConstitutiveModels"
      role: "process_solver"
      brief: >-
        Fifteen material families - linear elastic, classical plasticity (MC/DP/VM/TC and cap
        variants), Cam-Clay, Pastor-Zienkiewicz generalized plasticity, Ghrib-Tinawi concrete
        damage, Duncan-Chang hyperbolic elasticity, Goodman joint, creep, steel curves.
    - name: "StiffnessAssembly"
      role: "allocator"
      brief: "Element stiffness and assembly into CSR (PARDISO), skyline (PROFILE) or element-by-element (JPCG)."
    - name: "InternalForce"
      role: "process_solver"
      brief: "Strain from nodal displacement, stress from the constitutive law, internal force by integrating B^T sigma."
    - name: "NewtonRaphson"
      role: "integrator"
      brief: "Increment - step - iteration loop with force and nodal-value convergence checks (static_U)."
    - name: "NewmarkIntegration"
      role: "integrator"
      brief: "Implicit second-order time integration with beeta1 (gamma) and beeta2 (beta); mass and damping assembly."
    - name: "ExplicitIntegration"
      role: "integrator"
      applicability: "type_solver='EXPLICIT'"
      brief: "Central-difference advance on a lumped mass; CFL-limited, no linear solve."
    - name: "EigenExtraction"
      role: "process_solver"
      applicability: "type_problem='E' or 'W'"
      brief: "Modal frequencies, participation factors, modal mass and stiffness; response-spectrum superposition."
    - name: "HeatConduction"
      role: "process_solver"
      applicability: "a group with fieldid 'T'"
      brief: "Theta-method conduction with convection edges, heat sources and Zhu Bofang pipe-cooling superposition."
    - name: "SeepageField"
      role: "process_solver"
      applicability: "nflow /= 0 or a W-field group"
      brief: "Darcy flow in the soil and rock skeleton with a free-surface (phreatic) boundary."
    - name: "BiotCoupling"
      role: "process_solver"
      applicability: "mdofn 7 or 8 with coupled element indices 11-19, 24"
      brief: "u-p and u-pw consolidation coupling matrices."
    - name: "ContactSolver"
      role: "process_solver"
      applicability: "ngaps /= 0 or ngapb /= 0"
      brief: "Node-pair contact with open/closed/slip state iteration and interface damage."
    - name: "StabilityEvaluation"
      role: "diagnostic"
      applicability: "kstab /= 0, type_load='MAT_DE', or block_stab >= 1"
      brief: "Limit-state safety factor, strength reduction, and rigid-block sliding kinematics."
    - name: "ReliabilityFORM"
      role: "optional_module"
      applicability: "relis = 1"
      brief: "Rackwitz-Fiessler design-point iteration, equivalent-normal transformation, reliability index."
    - name: "ParameterInversion"
      role: "optional_module"
      applicability: "Bparameter /= 0 or nbackf /= 0"
      brief: "Levenberg-Marquardt, trust region with BFGS, rigid/elastic decomposition, nodal-value inversion."
    - name: "StagedConstruction"
      role: "driver"
      brief: "Element birth and death with stress release, and per-block material substitution."
    - name: "LinearSolver"
      role: "process_solver"
      brief: "PARDISO, skyline LDL^T, Jacobi-PCG and PBCG."
    - name: "MeshAdaptation"
      role: "optional_module"
      applicability: "rmesh /= 0 or meshc /= 0"
      brief: "Refinement and coarsening with interpolated result transfer."
    - name: "LevelSet"
      role: "optional_module"
      applicability: "level_set_problem /= 0"
      brief: "Level-set representation of an evolving internal boundary."
  internal_edges:
    - from: "Inputs"
      to: "ElementLibrary"
      kind: "consumes_input"
      brief: "Mesh, element index and group partition."
    - from: "Inputs"
      to: "ConstitutiveModels"
      kind: "consumes_input"
      brief: "Material records and their model-specific sub-records."
    - from: "ElementLibrary"
      to: "StiffnessAssembly"
      kind: "invokes"
      brief: "Shape-function derivatives and Jacobians for the element stiffness."
    - from: "ConstitutiveModels"
      to: "StiffnessAssembly"
      kind: "invokes"
      brief: "Tangent constitutive matrix."
    - from: "ConstitutiveModels"
      to: "InternalForce"
      kind: "invokes"
      brief: "Stress update from the strain increment."
    - from: "InternalForce"
      to: "gauss_point_state"
      kind: "writes_state"
      brief: "Stress, strain and state variables at each Gauss point."
    - from: "StiffnessAssembly"
      to: "LinearSolver"
      kind: "invokes"
      brief: "Assembled global matrix in the solver's storage format."
    - from: "LinearSolver"
      to: "NewtonRaphson"
      kind: "invokes"
      brief: "Displacement increment from K du = R."
    - from: "NewtonRaphson"
      to: "nodal_displacement"
      kind: "writes_state"
      brief: "Accumulated displacement after each converged iteration."
    - from: "NewtonRaphson"
      to: "Outputs"
      kind: "produces_output"
      brief: "Displacement, stress and the convergence record."
    - from: "NewmarkIntegration"
      to: "nodal_velocity"
      kind: "writes_state"
      brief: "Velocity and acceleration from the Newmark update."
    - from: "HeatConduction"
      to: "nodal_temperature"
      kind: "writes_state"
      brief: "Temperature field advance."
    - from: "nodal_temperature"
      to: "InternalForce"
      kind: "reads_state"
      brief: "Thermal strain enters the stress update through alfa."
    - from: "SeepageField"
      to: "nodal_pore_pressure"
      kind: "writes_state"
      brief: "Pore pressure and hydraulic head."
    - from: "nodal_pore_pressure"
      to: "InternalForce"
      kind: "reads_state"
      brief: "Terzaghi effective stress sigma' = sigma - p."
    - from: "BiotCoupling"
      to: "StiffnessAssembly"
      kind: "invokes"
      brief: "Coupling blocks added to the global matrix."
    - from: "ContactSolver"
      to: "contact_state"
      kind: "writes_state"
      brief: "Open/closed/slip state, contact force and gap."
    - from: "contact_state"
      to: "NewtonRaphson"
      kind: "reads_state"
      brief: "Contact force enters the residual."
    - from: "StagedConstruction"
      to: "StiffnessAssembly"
      kind: "invokes"
      brief: "Group activation controls which elements contribute."
    - from: "StabilityEvaluation"
      to: "Outputs"
      kind: "produces_output"
      brief: "Factor of safety on the declared surface."
    - from: "ReliabilityFORM"
      to: "Outputs"
      kind: "produces_output"
      brief: "Reliability index and design point."
    - from: "ParameterInversion"
      to: "ConstitutiveModels"
      kind: "invokes"
      brief: "Trial parameter vector for each objective evaluation."
    - from: "EigenExtraction"
      to: "Outputs"
      kind: "produces_output"
      brief: "Modal frequencies, periods and participation factors."

states:
  variables:
    - name: "nodal_displacement"
      unit: "m"
      role: "prognostic"
    - name: "nodal_velocity"
      unit: "m s-1"
      role: "prognostic"
    - name: "nodal_acceleration"
      unit: "m s-2"
      role: "prognostic"
    - name: "gauss_point_stress"
      unit: "Pa"
      role: "prognostic"
    - name: "gauss_point_strain"
      unit: "-"
      role: "prognostic"
    - name: "gauss_point_state_variables"
      unit: "-"
      role: "prognostic"
    - name: "nodal_pore_pressure"
      unit: "Pa"
      role: "prognostic"
    - name: "nodal_temperature"
      unit: "degC"
      role: "prognostic"
    - name: "contact_state"
      unit: "-"
      role: "prognostic"
    - name: "contact_force"
      unit: "N"
      role: "prognostic"
    - name: "joint_gap"
      unit: "m"
      role: "prognostic"
    - name: "damage_variable"
      unit: "-"
      role: "prognostic"
    - name: "creep_strain_history"
      unit: "-"
      role: "accumulator"
    - name: "group_activation"
      unit: "-"
      role: "diagnostic"
    - name: "equilibrium_residual_ratio"
      unit: "-"
      role: "diagnostic"
  provenance: "populated"

outputs:
  - var: "DISPLACEMENT"
    unit: "m"
    description: >-
      Displacement vector at every mesh node of the solid medium - the concrete dam or lock
      body together with its soil and rock foundation. This is the quantity dam monitoring
      instruments (plumb lines, invar wires, geodetic targets, GNSS) measure directly, and
      the quantity every HSTAR analysis is judged by.
    emitted_in: "<probn>.flavia.res, result block 'DISPLACEMENT'"
    validation_rank: 1
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          caveats:
            - "A monitoring record is relative to an installation datum; compare increments, not absolutes, unless the model reproduces the construction history."
            - "Plumb-line readings are usually in mm; HSTAR is in m."
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          caveats:
            - "A single reading confounds thermal, hydrostatic and irreversible components."
      detrending_options: ["none", "first_difference", "linear_residual"]
  - var: "TEMPERATURE"
    unit: "degC"
    description: >-
      Temperature of the solid medium - mass concrete and the soil and rock foundation -
      at mesh nodes, comparable with embedded thermometer strings.
    emitted_in: "<probn>.flavia.res, result block 'TEMPERATURE'"
    validation_rank: 2
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match", "timing_accuracy"]
          caveats:
            - "Hydration heat dominates the first weeks; ambient forcing dominates later."
      detrending_options: ["none", "linear_residual"]
  - var: "PORE-PRESSURE"
    unit: "Pa"
    description: >-
      Pore water pressure in the soil and rock skeleton - the groundwater pressure in the
      foundation, the embankment and the grout curtain - comparable with piezometer readings.
    emitted_in: "<probn>.flavia.res, result block 'PORE-PRESSURE'"
    validation_rank: 3
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          caveats:
            - "Piezometers are commonly reported as a head in metres; multiply by the water unit weight to compare with Pa."
      detrending_options: ["none", "first_difference"]
  - var: "WATER-HEAD"
    unit: "m"
    description: >-
      Hydraulic head of the groundwater in the soil and rock medium, i.e. the phreatic
      surface elevation and the seepage potential field, comparable with observation-well
      water levels.
    emitted_in: "<probn>.flavia.res, result block 'WATER-HEAD'"
    validation_rank: 4
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match"]
          caveats:
            - "Head is datum-dependent; confirm the model and the well share a vertical datum."
      detrending_options: ["none"]
  - var: "modal_frequency"
    unit: "Hz"
    description: >-
      Natural vibration frequency of the dam-foundation system - the concrete structure
      coupled to its soil and rock foundation and, when the added-mass or interface model is
      active, to the reservoir water - comparable with ambient-vibration or forced-vibration
      modal identification.
    emitted_in: "<probn>.chk, records 'order= .. omega= .. freq= .. period= ..'; base mode also in <probn>.omg"
    validation_rank: 5
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy", "ranking_quality"]
          caveats:
            - "Identified modes must be paired with computed modes by mode shape (MAC), not by order."
            - "Reservoir level changes the frequencies; state the level for both."
      detrending_options: ["none"]
  - var: "acceleration"
    unit: "m s-2"
    description: >-
      Acceleration of the solid medium - the dam body and its soil and rock foundation -
      during seismic shaking, comparable with structural accelerograph records.
    emitted_in: "<probn>.flavia.res, result blocks 'acceleration' and 'acceleration_ab'"
    validation_rank: 6
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy", "temporal_pattern_match", "timing_accuracy"]
          caveats:
            - "'acceleration' is relative to the moving base; 'acceleration_ab' is absolute."
            - "Records in g must be scaled by 9.81 before comparison."
      detrending_options: ["none", "first_difference"]
  - var: "STRESS"
    unit: "Pa"
    description: >-
      Cauchy stress tensor in the solid medium - concrete and the soil and rock foundation -
      averaged to mesh nodes, comparable with stress-meter and strain-gauge derived stresses.
    emitted_in: "<probn>.flavia.res, result block 'STRESS' (SIGXX SIGYY SIGXY SIGZZ in 2-D)"
    validation_rank: 7
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_time_series"
          comparison_mode: "time_series_comparison"
          metric_families: ["magnitude_accuracy"]
          caveats:
            - "Node-averaged: boundary rows carry a half-element offset (see triplet dt_025)."
            - "Embedded stress meters measure a local, disturbed stress state."
      detrending_options: ["none"]
  - var: "factor_of_safety"
    unit: "-"
    description: >-
      Sliding-stability factor of safety of the structure on its declared failure surface -
      a dam block on its soil and rock foundation contact, or a soil slope with an unknown
      slip surface found by strength reduction.
    emitted_in: "<probn>.chk safety-factor records (kstab path) or, for strength reduction, the last converged step"
    validation_rank: 8
    observability:
      comparable_obs_shapes:
        - obs_shape: "point_snapshot"
          comparison_mode: "scalar_comparison"
          metric_families: ["magnitude_accuracy"]
          caveats:
            - "The strength-reduction value depends on miter (triplet dt_021)."
            - "Comparable with a limit-equilibrium factor of safety, not with an observation."
      detrending_options: ["none"]
  - var: "velocity"
    unit: "m s-1"
    description: "Velocity of the solid medium at mesh nodes during a dynamic analysis."
    emitted_in: "<probn>.flavia.res, result block 'velocity'"
  - var: "PRINCIPALSTRESS"
    unit: "Pa"
    description: "Principal stresses and their directions in the solid medium."
    emitted_in: "<probn>.flavia.res, result block 'PRINCIPALSTRESS'"
  - var: "PLASTICSTRAIN"
    unit: "-"
    description: "Equivalent plastic strain in the solid medium, marking the developing failure zone."
    emitted_in: "<probn>.flavia.res, result block 'PLASTICSTRAIN'"
  - var: "Yield"
    unit: "-"
    description: "Yield indicator per node - whether the constitutive law is on its yield surface."
    emitted_in: "<probn>.flavia.res, result block 'Yield'"
  - var: "tofor"
    unit: "N"
    description: "Total external nodal force vector assembled for the current step."
    emitted_in: "<probn>.flavia.res, result block 'tofor'"
  - var: "uplift-PRESSURE"
    unit: "Pa"
    description: "Uplift pressure applied on the declared foundation contact surfaces."
    emitted_in: "<probn>.flavia.res, result block 'uplift-PRESSURE'; binary state in <probn>.upf"
  - var: "reliability_index"
    unit: "-"
    description: "First-order reliability index beta of the sliding limit state; failure probability is Phi(-beta)."
    emitted_in: "<probn>.chk, records containing 'beta='"
  - var: "equilibrium_residual_ratio"
    unit: "-"
