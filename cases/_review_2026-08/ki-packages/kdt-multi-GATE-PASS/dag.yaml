safety:
  hazards:
    - id: "unit_agnostic_no_range_check"
      kind: "parser_semantic"
      description: >-
        No unit conversion or range check exists anywhere in the source, so an inconsistent
        unit system converges to a confidently wrong answer.
      severity: "silent"
    - id: "list_directed_record_shift"
      kind: "parser_semantic"
      description: >-
        A short control record makes the list-directed read spill onto the next line, shifting
        every subsequent record without any error.
      severity: "silent"
    - id: "inert_edge_load"
      kind: "control_semantic"
      description: >-
        An edge load whose parent element group is not active in the block contributes nothing
        and is never reported; verified on cases/static.
      severity: "silent"
    - id: "coupled_dof_uncoupled_element"
      kind: "control_semantic"
      description: >-
        Declaring a pressure DOF without switching the element group to a coupled element index
        gives a converged run with zero pore pressure everywhere.
      severity: "silent"
    - id: "birth_death_without_stress_release"
      kind: "control_semantic"
      description: >-
        appear = 0 removes an element without releasing its internal force; only appear = -1
        models excavation.
      severity: "silent"
    - id: "explicit_cfl_unchecked"
      kind: "numerical_instability"
      description: >-
        The explicit central-difference path is CFL-limited and the step size is not checked.
      severity: "fatal"
    - id: "strength_reduction_depends_on_miter"
      kind: "control_semantic"
      description: >-
        The strength-reduction factor of safety is defined by non-convergence, so the maximum
        iteration count changes the reported value.
      severity: "silent"
    - id: "stale_contact_or_restart_state"
      kind: "initial_condition_semantic"
      description: >-
        Unformatted .ctt and .rtt files are re-read when their switches are non-zero and do not
        carry a mesh signature.
      severity: "fatal_or_silent"
    - id: "interactive_stdin_prompts"
      kind: "control_semantic"
      description: >-
        Interactive read * sites remain in the code and cause an end-of-file abort after an
        otherwise complete solution when stdin is closed.
      severity: "fatal"
    - id: "node_averaged_stress_at_boundaries"
      kind: "parser_semantic"
      description: >-
        The reported nodal stress is an average over adjoining elements, so boundary rows are
        offset by half an element from the point value.
      severity: "degraded"
  validation_limits:
    - "No reservoir hydrodynamics: the water is an added mass or a prescribed pressure, so sloshing and compressibility effects beyond the chosen interface model are outside scope."
    - "Smeared or damage-based cracking only; no discrete crack propagation with remeshing."
    - "Small-strain formulation unless Blarge = 1 is set; large rotations of soil masses are not modelled by default."
    - "The seepage free surface is handled by a node list, not by a moving mesh; strongly transient phreatic surfaces need mesh refinement."
    - "Rate-dependent soil behaviour beyond the implemented creep laws is not represented."
  warnings:
    - "Every load block requires its own record group in .pre, .man and .sol; raising nblks alone aborts at the start of block 2."
    - "Angles in .mat are in degrees; thermal diffusivity is per the same time unit as ditime in .man."
    - "Permeability is a hydraulic conductivity in m/s, not an intrinsic permeability in m2."
    - "Newmark gamma > 1/2 adds algorithmic damping; the shipped quasi-static template uses 0.6."
    - "PARDISO mtype must be -2 for the symmetric indefinite systems this model produces."
  assumptions:
    - statement: "All shipped cases and this KI use strict SI: m, Pa, kg/m3, N, s, degC, with angles in degrees in .mat."
      scope: "every input and output quantity"
      source: "Empirical audit of cases/static, lame_cylinder, test_thermal_expansion, mini_3d and the train01-train12 case set; confirmed against the SOLID and body-force read statements in Material.f90:289 and Load.f90:892."
      status: "adopted"
    - statement: "nmass, nsmat, nhmat, nqmat, ntsmat and nthmat are matrix re-formation intervals, not material record ids."
      scope: "the .glb records that carry them"
      source: "modf_time_order, Fem.f90:15480-15545"
      status: "adopted"
    - statement: "The equilibrium residual ratio written to .chk is treated as this model's conservation statement, in place of a mass balance."
      scope: "post-run validation"
      source: "conver_load, and the 'ratio for residu norm=' records of <probn>.chk"
      status: "adopted"
    - statement: "The reported nodal stress is compared as a domain mean or at interior nodes, because the .flavia.res STRESS stream is node-averaged."
      scope: "analytic verification of stress"
      source: "average_appear(1:ngroup) in <probn>.glb and OUT_GID_WRITE in Output.f90"
      status: "adopted"
    - statement: "cases/test_beam2d is not a runnable legacy case and is excluded from the template catalogue."
      scope: "template selection"
      source: "Observed SIGSEGV under the legacy Linux binary on 2026-08-26; the case was converted for the Easy_HSTAR rewrite."
      status: "adopted"
