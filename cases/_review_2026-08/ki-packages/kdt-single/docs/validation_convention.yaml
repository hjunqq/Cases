# HSTAR — what counts as validated.
#
# dag.yaml says WHICH comparisons are admissible. This file says what counts as
# a pass, per (comparing_variable, obs_shape): the headline metric, its
# direction, the numeric bands, and the citation each band came from.
#
# PROVENANCE. The toolkit's stepb_dispatch_prep.py / stepb_verify.py are not
# installed on this host (`/home/server/knowledge-dissection-toolkit` does not
# exist), so this file was authored against the schema by hand from
# docs/gathered_papers.json and from this KI's own measured verification.
#
# RULE APPLIED THROUGHOUT: every band is a plain number carrying a `direction`,
# and a band with no cited numeric threshold is `null` -- not a guess. Where the
# literature this KI could retrieve gives no numeric acceptance criterion, the
# band is null and `band_note` records what was searched. An uncited number is
# worse than no number.

model_id: HSTAR
schema: validation_convention/1
authored: 2026-08-26

conventions:

  # ------------------------------------------------------------------
  # 1. Displacement against a closed-form elasticity solution.
  #    This is the tier this KI was actually validated at, so the bands are
  #    cited to a measurement rather than to a paper.
  # ------------------------------------------------------------------
  - comparing_variable: displacement_field
    obs_shape: analytic_closed_form_solution
    headline_metric: max_relative_error
    direction: minimize
    bands:
      excellent: 0.001
      good: 0.01
      acceptable: 0.05
      unacceptable_above: 0.05
    citation: >
      This KI's own verification, recorded in
      work/stage_log.json:s8_validation and work/figures/s8_validation.png,
      2026-08-26. Two closed-form references were run through the full tool
      chain on the Linux ifx/oneMKL build:
      (a) 1-D confined (oedometer) compression under self weight, 1x20 Q4 mesh,
          max relative error 1.60e-16 -- linear elements are exact at the nodes
          for this problem, so the residual is round-off;
      (b) Lame thick-walled cylinder under internal pressure, plane strain,
          8x8 Q4 mesh, max relative error 4.66e-03, NSE 0.998865, r 0.99999996.
      The `good` band of 0.01 is the 8x8 result rounded up; the `excellent`
      band of 0.001 is the 16x16 result (1.169e-03) rounded up.
    secondary_metrics:
      - name: nse
        direction: maximize
        bands: {excellent: 0.999, good: 0.99, acceptable: 0.95,
                unacceptable_below: 0.95}
        citation: >
          Same verification record: NSE 1.000000 (confined column) and 0.998865
          (Lame 8x8), rising to 0.99999466 at 32x32. For a smooth analytic
          reference an NSE below 0.95 means the discretisation, not the noise,
          dominates.
      - name: rmse
        direction: minimize
        bands: null
        band_note: >
          RMSE is dimensional and problem-scale dependent; no scale-free band is
          meaningful. Reported for the record, never used as the verdict.
    convergence_requirement:
      quantity: observed_order_of_accuracy
      direction: maximize
      expected: 2.0
      bands:
        excellent: 1.95
        good: 1.8
        acceptable: 1.5
        unacceptable_below: 1.5
      citation: >
        Bilinear (Q4) and trilinear (B8) Lagrange elements are second-order
        accurate in the displacement norm by construction. Measured on this
        build over a 4x4 -> 8x8 -> 16x16 -> 32x32 sequence of the Lame case:
        p = 1.984, 1.996, 1.999 (mean 1.993). A measured order well below 2
        indicates a defect -- distorted elements, a wrong boundary condition, or
        a load applied to the wrong faces -- not merely a coarse mesh.

  # ------------------------------------------------------------------
  # 2. Displacement against dam monitoring instruments.
  # ------------------------------------------------------------------
  - comparing_variable: displacement_field
    obs_shape: dam_displacement_timeseries
    headline_metric: max_relative_error
    direction: minimize
    bands: null
    band_note: >
      No numeric acceptance criterion could be cited from the literature this KI
      was able to retrieve. Searched via OpenAlex for "concrete arch dam
      displacement monitoring model prediction accuracy plumb line" and "dam
      safety monitoring inverse analysis elastic modulus identification"; the
      retrievable open-access papers (10.1016/j.engstruct.2019.05.072,
      10.1007/s13349-020-00380-w, 10.1016/j.asoc.2016.12.014) report "good
      agreement" and show residual plots but state no threshold. The
      corresponding practice standards (ICOLD bulletins, Chinese SL 601 dam
      monitoring code) are not open access -- see docs/paywalled_targets.json.
      The gate must therefore NOT auto-validate on this pair, and must not
      loosen to fill the gap.
    secondary_metrics:
      - name: nse
        direction: maximize
        bands: null
        band_note: >
          If NSE or KGE is reported for a monitoring comparison, remember that
          their zero points differ: KGE = -0.41, not 0, is the value a
          mean-of-observations benchmark attains, so a "positive KGE" is not
          evidence of skill. Cited: Knoben, Freer & Woods (2019),
          doi:10.5194/hess-23-4323-2019, "Technical note: Inherent benchmark or
          not? Comparing Nash-Sutcliffe and Kling-Gupta efficiency scores"
          (full text retrieved).
      - name: pbias
        direction: zero_centered
        bands: null
        band_note: same gap as the headline metric
    guidance: >
      What CAN be checked without a threshold: (i) the sign and seasonal phase
      of the modelled displacement must match the instrument; (ii) the annual
      range must match to within the instrument's own repeatability; (iii) the
      residual must not drift monotonically, which indicates a missing
      irreversible process (creep, joint opening, foundation degradation)
      rather than a parameter error.

  # ------------------------------------------------------------------
  # 3. Concrete temperature.
  # ------------------------------------------------------------------
  - comparing_variable: temperature_field
    obs_shape: concrete_temperature_timeseries
    headline_metric: rmse
    direction: minimize
    bands: null
    band_note: >
      No cited numeric band. Searched for "mass concrete temperature field
      measured computed comparison dam construction" and "hydration heat
      adiabatic temperature rise concrete finite element"; the retrievable
      open-access material (10.1016/j.cemconres.2019.05.015, "Properties of
      early-age concrete relevant to cracking") characterises the material
      properties and their scatter but gives no acceptance criterion for a
      computed temperature field. Field practice quotes 1-2 degC, but this KI
      could not retrieve a citable source, so the band stays null.
    secondary_metrics:
      - name: max_relative_error
        direction: minimize
        bands: null
        band_note: >
          A relative error on a Celsius temperature is datum-dependent and
          should not be used; compare on the RISE above placing temperature if a
          relative measure is needed.
    guidance: >
      Physical bounds that hold regardless of any band: the computed temperature
      must lie between the coldest boundary value and the placing temperature
      plus the full adiabatic rise, and the interior peak must lag the surface.
      A field that reaches the boundary value everywhere within one or two steps
      is the diffusivity unit error, triplet dt_011.

  # ------------------------------------------------------------------
  # 4. Pore pressure.
  # ------------------------------------------------------------------
  - comparing_variable: pore_pressure_field
    obs_shape: piezometer_head_timeseries
    headline_metric: rmse
    direction: minimize
    bands: null
    band_note: >
      No cited numeric band. Searched for "unsaturated seepage finite element
      earth dam phreatic line piezometer"; the retrievable open-access papers
      (10.1007/s40996-021-00613-y, 10.17577/ijertv8is080168) compare computed
      phreatic surfaces and seepage rates qualitatively and give no threshold.
    secondary_metrics:
      - name: nse
        direction: maximize
        bands: null
        band_note: see the KGE zero-point caution under convention 2
    guidance: >
      Check instead that the computed head never exceeds the imposed upstream
      head, that the phreatic surface exits below the downstream toe, and that
      the transient run relaxes to the steady solution when run long enough.

  # ------------------------------------------------------------------
  # 5. Natural frequency.
  # ------------------------------------------------------------------
  - comparing_variable: natural_frequency
    obs_shape: ambient_vibration_modal_frequency
    headline_metric: max_relative_error
    direction: minimize
    bands: null
    band_note: >
      No cited numeric band retrievable. Searched for "Westergaard added mass
      hydrodynamic pressure gravity dam earthquake" and "dynamic structural
      health monitoring concrete gravity dam"; 10.1007/s13349-020-00380-w
      (retrieved) performs Bayesian model updating against measured modal data
      but reports posterior distributions rather than an acceptance threshold.
    guidance: >
      The informative check is the RATIO, not the absolute value: adding
      Westergaard mass must lower every frequency, and the reduction for a full
      reservoir is of the order of tens of percent. The shipped HSTAR case
      library records a 19 % drop between `train03a_modal_dry` and
      `train03b_modal_ifs` on the same mesh; reproducing that ratio is a
      stronger test of the added-mass implementation than any single frequency.

  # ------------------------------------------------------------------
  # 6. Safety factor.
  # ------------------------------------------------------------------
  - comparing_variable: safety_factor
    obs_shape: limit_equilibrium_factor_of_safety
    headline_metric: relative_error
    direction: minimize
    bands: null
    band_note: >
      No cited numeric band. 10.1007/s40891-016-0076-0 (retrieved) compares
      limit-equilibrium and finite-element factors of safety for a nailed slope
      and shows them converging, but quotes no tolerance. The comparison is in
      any case method-dependent: strength reduction and limit equilibrium define
      the factor differently, so a difference of a few percent is expected and
      is not by itself an error.
    guidance: >
      Report the two numbers side by side with the definition each uses, and
      check that the strength-reduction run's failure mechanism (the plastic
      band) coincides with the limit-equilibrium critical surface. A matching
      number with a different mechanism is a coincidence, not agreement.

  # ------------------------------------------------------------------
  # 7. Global equilibrium -- always checkable, no literature needed.
  # ------------------------------------------------------------------
  - comparing_variable: support_reaction
    obs_shape: internal_equilibrium_identity
    headline_metric: relative_residual
    direction: minimize
    bands:
      excellent: 1.0e-6
      good: 1.0e-4
      acceptable: 1.0e-3
      unacceptable_above: 1.0e-3
    citation: >
      Not a literature threshold but an identity: for a converged static
      solution, sum(reactions) + sum(applied load) must vanish to solver
      precision. The practical floor is set by HSTAR's own output format --
      `*.act` prints reactions with five significant figures, which caps the
      achievable relative residual at about 1e-5. Measured on this build for the
      confined-column verification: reactions 2.35417e5 N against an applied
      self weight of 2.35440e5 N, relative residual 9.77e-5, entirely accounted
      for by that print precision. A residual materially above 1e-3 means the
      load never reached the mesh (triplet dt_013), not that the solver is
      inaccurate.

notes:
  - >
    HSTAR's field grades on RELATIVE ERROR against a reference, not on the
    NSE/KGE family that hydrological KIs use. NSE and r are recorded as
    secondary metrics because they are cheap and comparable across KIs, but a
    structural verification that reports NSE = 0.99 while the peak displacement
    is 30 % wrong has not been validated -- NSE is dominated by the many small
    values in a displacement field.
  - >
    A run that fails the run-health layer (non-convergence in `*.chk`) or the
    equilibrium layer is not eligible for any band. Order the layers: health,
    plausibility, equilibrium, then benchmark.
  - >
    Where a band is null the gate must abstain, not substitute a default. Six of
    the seven conventions here are null precisely because this KI could not
    retrieve a citable threshold, and that is the honest state of the field's
    open literature for structural FEM acceptance criteria.
