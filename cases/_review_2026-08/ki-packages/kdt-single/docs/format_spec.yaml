# HSTAR — machine-readable I/O contract.
#
# PROJECTION OF dag.yaml. Every observable output in dag.yaml appears here under
# `outputs.primary` with the SAME name and unit; every non-observable output
# appears under `outputs.secondary`. `known_issues` carries one prose entry per
# triplet in diagnostics/triplets.yaml.
#
# The toolkit generator (generate_format_spec.py) is not installed on this host
# (/mnt/disk1/Hydrocraft_server/ does not exist), so this file was projected by
# hand from dag.yaml and checked against it name-by-name and unit-by-unit.

model:
  name: HSTAR
  language: fortran90
  implementation: >
    ~80 000 lines across 17 compilation units; built with Intel ifx + oneMKL.
    No command-line arguments — the run is selected by the `inp` file in the
    current working directory.
  scientific_reference_version: >
    GEHOMadrid Beta 1.0 user manual (Hohai University Institute of Hydraulic
    Structures, April 2004) and its companion temperature-field manual; HSTAR
    source revisions through 2025-07.
  domain: structural_fem
  spatial_dimension: [1, 2, 3]

inputs:
  forcing:
    - name: gravity_body_force
      unit: m s-2
      description: >
        Gravitational acceleration and its direction cosines applied as a body
        force to the solid continuum, scaled per element group by a time curve.
        File `*.loa`, body-force record `gravy factg(1:ndimn) factf(1:ndimn)`.
    - name: surface_pressure
      unit: Pa
      description: >
        Normal pressure on boundary faces of the solid — hydrostatic reservoir
        load, silt pressure or any traction. Positive is compression onto the
        face. File `*.loa`, edge-load group.
    - name: nodal_point_load
      unit: N
      description: Concentrated force at named mesh nodes. File `*.loa`.
    - name: seismic_acceleration_time_history
      unit: m s-2
      description: >
        Ground acceleration record driving the base of the structural model.
        File `*.loa`, `SEISMIC` time curve.
    - name: ambient_air_temperature
      unit: degC
      description: >
        Air temperature bounding the convection surfaces of the concrete solid,
        T = a + b*sin(pi*(c*t + d)/180). Files `*.loa` (`SIN` curve) + `*.tem`.
    - name: adiabatic_hydration_rise
      unit: degC
      description: >
        Adiabatic temperature rise of fresh concrete, theta = a*t/(b + t),
        acting as an internal heat source. File `*.loa`, `DABT` curve.
    - name: prescribed_nodal_value
      unit: m | degC | m head
      description: >
        Dirichlet condition on any degree of freedom — support displacement of
        the solid, surface temperature of the solid, or piezometric head of the
        pore water. Multiplied by its time curve. File `*.pre`.
    - name: reservoir_water_level
      unit: m
      description: >
        Elevation of the reservoir free surface in the mesh datum, driving
        uplift pressure under the dam base. File `*.glb`, `water_level` record.
        The value -99.0 is a sentinel meaning "no reservoir".
    - name: observed_monitoring_series
      unit: m | degC
      description: >
        Measured displacement or temperature series at instrument points, used
        only by the inverse-analysis capability. File `*.obs`.
  parameters:
    - name: youngs_modulus
      unit: Pa
      description: Elastic modulus of the solid material. File `*.mat`.
    - name: poissons_ratio
      unit: "1"
      description: Poisson ratio of the solid material. File `*.mat`.
    - name: mass_density
      unit: kg m-3
      description: Bulk density of the solid material. File `*.mat`.
    - name: thermal_expansion_coefficient
      unit: degC-1
      description: Linear thermal expansion of the solid. File `*.mat`.
    - name: thermal_diffusivity
      unit: m2 day-1
      description: >
        Thermal diffusivity a = lambda/(c*rho) of the solid, per coordinate
        direction, expressed per DAY to match `ditime`. File `*.mat` HEAT/SOLID.
    - name: surface_heat_transfer_ratio
      unit: m day-1
      description: >
        beta/(c*rho) for a convection surface of the solid, not the raw film
        coefficient. File `*.tem`, `beta_bar`.
    - name: permeability
      unit: m s-1
      description: Darcy permeability of the porous solid skeleton. File `*.mat` FLUID phase.
    - name: cohesion
      unit: Pa
      description: Cohesion of the solid material. File `*.mat`.
    - name: friction_angle
      unit: degree
      description: Internal friction angle of the solid material. File `*.mat`.
    - name: dilation_angle
      unit: degree
      description: Dilation angle of the solid material. File `*.mat`.
    - name: joint_normal_stiffness
      unit: Pa m-1
      description: Normal stiffness of a joint or contact interface in the solid.
    - name: joint_shear_stiffness
      unit: Pa m-1
      description: Shear stiffness of a joint or contact interface in the solid.
    - name: tensile_strength
      unit: Pa
      description: Tensile strength of the solid / joint. Files `*.mat`, `*.glb` (`ftcrack`).
    - name: creep_compliance_parameters
      unit: Pa-1, day-1
      description: Kelvin-chain creep compliance and ageing-modulus parameters of concrete.
    - name: rayleigh_damping_alpha
      unit: s-1
      description: Mass-proportional Rayleigh damping coefficient. File `*.glb` group stanza.
    - name: rayleigh_damping_beta
      unit: s
      description: Stiffness-proportional Rayleigh damping coefficient. File `*.glb` group stanza.
    - name: newmark_gamma
      unit: "1"
      description: Newmark gamma. File `*.glb`, `BEETA1`.
    - name: newmark_beta
      unit: "1"
      description: Newmark beta. File `*.glb`, `BEETA2`.
    - name: theta_time_factor
      unit: "1"
      description: Theta of the theta-method for the transient field equations. File `*.glb`, `THETA1`.
    - name: time_step
      unit: s (dynamics) | day (thermal, creep, staging)
      description: Load/time step size. File `*.man`, `ditime`.
    - name: force_convergence_tolerance
      unit: "1"
      description: Relative residual force tolerance. File `*.man`, `toler_force`.
    - name: strength_reduction_target
      unit: "1"
      description: Target limit-state or safety factor for a stability run. File `*.glb`, `kstab`.

outputs:
  primary:
    - name: displacement_field
      unit: m
      validation_rank: 1
      emitted_in: "*.flavia.res block DISPLACEMENT; *.opw; *.dis"
      description: >
        Displacement vector of the solid structural continuum (concrete, rock or
        soil skeleton) at every mesh node, per output step.
    - name: stress_field
      unit: Pa
      validation_rank: 2
      emitted_in: "*.flavia.res block STRESS (SIGXX SIGYY SIGXY SIGZZ / 6 in 3-D);
                   *.gpv at Gauss points; *.oew element averages"
      description: >
        Cauchy stress tensor in the solid structural continuum (concrete, rock or
        soil skeleton), smoothed to nodes and raw at Gauss points.
    - name: temperature_field
      unit: degC
      validation_rank: 3
      emitted_in: "*.flavia.res block TEMPERATURE; binary *.oit (nodal delta-T)"
      description: >
        Temperature of the solid concrete / rock continuum at every mesh node,
        including hydration heat and pipe cooling.
    - name: pore_pressure_field
      unit: Pa
      validation_rank: 4
      emitted_in: "*.flavia.res blocks PORE-PRESSURE / Excess_PORE-PRESSURE; binary *.oip"
      description: >
        Pore water pressure within the porous solid skeleton (dam foundation,
        embankment or rock mass); the excess block reports the departure from
        the steady state.
    - name: joint_relative_displacement
      unit: m
      validation_rank: 5
      emitted_in: "*.ctr (contact gaps); *.gdm (Goodman elements); *.ojw (joint stresses)"
      description: >
        Normal opening and tangential slip across a construction joint, contact
        interface or rock discontinuity in the solid structure.
    - name: natural_frequency
      unit: Hz
      validation_rank: 6
      emitted_in: "*.chk (frequency_analysis, type_problem='W')"
      description: >
        Natural vibration frequency of the structural solid, optionally including
        Westergaard added mass from the reservoir water.
    - name: support_reaction
      unit: N
      validation_rank: 7
      emitted_in: "*.act (sets with outfix=1)"
      description: >
        Reaction force at constrained nodes of the solid structure; its sum is
        the global equilibrium check against the applied load.
    - name: safety_factor
      unit: "1"
      validation_rank: 8
      emitted_in: "*.chk (safety_factor when kstab/=0); *.fai"
      description: >
        Limit-state or strength-reduction factor of the solid slope / structure,
        from the kstab limit-state search or the MAT_DE strength-reduction sweep.
  secondary:
    - name: principal_stress
      unit: Pa
      emitted_in: "*.flavia.res block PRINCIPALSTRESS"
      description: >
        Principal values of the Cauchy stress tensor in the solid continuum.
        Derived from stress_field; not independently observable.
    - name: plastic_strain
      unit: "1"
      emitted_in: "*.flavia.res block PLASTICSTRAIN"
      description: >
        Accumulated equivalent plastic strain in the solid continuum, marking
        the yielded zone. Model-internal; no direct instrument.
    - name: concrete_damage_index
      unit: "1"
      emitted_in: "*.gpv (Gauss-point state when material CONCRETE is active)"
      description: >
        Ghrib-Tinawi scalar damage variable of the concrete solid, 0 intact to 1
        fully cracked. Model-internal.
    - name: bar_axial_force
      unit: N
      emitted_in: "*.bar"
      description: >
        Axial force and bond slip of embedded reinforcement / anchor bars in the
        concrete solid.
    - name: reliability_index
      unit: "1"
      emitted_in: "*.chk (relis / sysrelis runs)"
      description: >
        Hasofer-Lind first-order reliability index beta of the solid structure
        for the declared limit state.
    - name: inverted_parameters
      unit: as the inverted property
      emitted_in: "*.chk (Bparameter runs); *.obsc"
      description: >
        Material parameter vector recovered by fitting the simulated response of
        the solid to the observed monitoring series.
    - name: restart_state
      unit: n/a
      emitted_in: "*.rtt (unformatted)"
      description: >
        Complete internal state of the solid model at the last saved step, for
        restarting. Not a physical quantity.

known_issues:
  - id: dt_001
    symptom: "The binary is launched with a case path as an argument and either dies on a missing .glb or analyses a different case."
    remedy: "cd into the case directory and run the bare binary with `inp` record 4 set to `1`; tools/run_hstar.py enforces it."
  - id: dt_002
    symptom: "gfortran rejects FORM='BINARY', buffered=, blocksize=, or cannot find MKL_RCI / MKL_VSL."
    remedy: "Build with Intel ifx plus oneMKL using tools/build_hstar.py; run --check-only first."
  - id: dt_003
    symptom: "Link fails with undefined GiD_* symbols."
    remedy: "Link the gidpost C stub and keep outplot='GIDR' or 'GIDA' so the binary post-processing path is never entered."
  - id: dt_004
    symptom: "Immediate end-of-file on unit 1, or 1.chk echoes nonsensical control values."
    remedy: "Never author .glb from scratch; clone a template with make_case.py and edit tokens with set_analysis.py."
  - id: dt_005
    symptom: "A tool reports that a .glb heading record cannot be found."
    remedy: "The case file predates that record; migrate the case onto a current template rather than patching the old file."
  - id: dt_006
    symptom: "Array-bounds error inside read_element, or a field that is far too stiff or too soft."
    remedy: "Keep the element name and the library index consistent; write_mesh.py sets both from one table."
  - id: dt_007
    symptom: "A construction stage that should be inactive still carries stress, or a group volume does not match the geometry."
    remedy: "Sort .ele by group ascending with no interleaving; write_mesh.py asserts it."
  - id: dt_008
    symptom: "Zero or negative pivot from the skyline solver, or patches of stress with the wrong sign."
    remedy: "List 2-D element nodes counter-clockwise; write_mesh.py checks every signed area."
  - id: dt_009
    symptom: "After a remesh the model becomes far too flexible or rotates as a rigid body."
    remedy: "Select constrained nodes by coordinate predicate, not by literal node id."
  - id: dt_010
    symptom: "A converged run reports displacements of metres where millimetres were expected."
    remedy: "Give E and every stress-like parameter in pascals; write_materials.py range-checks them and validate_results.py flags |u|max above L/10."
  - id: dt_011
    symptom: "A transient thermal run flattens to the boundary temperature in one or two steps."
    remedy: "Give thermal diffusivity in m2/day to match the day-based ditime; the tools range-check it to 1e-4..1."
  - id: dt_012
    symptom: "Singular stiffness matrix, zero pivot, or PARDISO error -4."
    remedy: "Constrain every active translational DOF somewhere; write_boundary.py refuses to leave one free."
  - id: dt_013
    symptom: "A converged run with a smooth field and a displacement magnitude far too small, or exactly zero."
    remedy: "Check global equilibrium against the applied resultant; make sure the face list is non-empty, the gravity curve id is non-zero, and the group is active."
  - id: dt_014
    symptom: "A p4 reservoir-pressure element behaves like a thin_film element, or the reverse."
    remedy: "Declare thin-film groups with index 26 and reservoir pressure elements with index 22; verify the resolved index echoed in 1.chk."
  - id: dt_015
    symptom: "Exit status 0, healthy 1.chk, and an empty or absent 1.flavia.res."
    remedy: "Set gid_u=1 and gid_s=1, noutf=1, and keep outplot='GIDR' or 'GIDA'."
  - id: dt_016
    symptom: "forrtl: severe (24) end-of-file on unit 9 (1.man), right after 1.chk prints ' in static_U**'."
    remedy: "Write nine fields in the .man increment record, ending with cwater and Qstatic; write_steps.py does."
  - id: dt_017
    symptom: "A Biot run produces displacements but no pore-pressure block."
    remedy: "Use a two-field *cN element (q4c4, b8c8, ...) with nrfields=2 and fieldid='UW'."
  - id: dt_018
    symptom: "A joint never opens; the normal gap stays at its initial value throughout."
    remedy: "Declare a GOODMAN/JANBU material and point the joint group's matno at it."
  - id: dt_019
    symptom: "A dynamic run shows the incident wave returning from the model edge with no decay."
    remedy: "Set exx, uxx and densxx on the nabssgroup record to the far-field properties actually adjacent to the boundary, and type_ABC='VIE'."
  - id: dt_020
    symptom: "Bar force in *.bar looks reasonable while the reported slip is identically zero."
    remedy: "Set ikindks in the .glb ftcrack record as well as ikindsc in the nrcsteel stanza."
  - id: dt_021
    symptom: "The trust-region inversion exhausts its iteration budget without reducing the residual."
    remedy: "Give each parameter a `factor` that scales it into roughly 1e-2..1e2."
  - id: dt_022
    symptom: "The FORM iteration oscillates, or reports a negative reliability index for a safe structure."
    remedy: "Supply a symmetric, unit-diagonal, positive-definite correlation matrix in *.sto."
  - id: dt_023
    symptom: "forrtl: severe (59) list-directed syntax error on unit 21, right after `nedge=` is printed."
    remedy: "Write four fields in the .loa face-class record: sedge nnode index vdimn (vdimn=0 for the ordinary case)."
  - id: dt_024
    symptom: "List-directed syntax error on unit 21 after edge_load_group, or pressure applied to the wrong faces."
    remedy: "Write five fields in the .loa edge-load group record: begin end itcurve water code_load."
  - id: dt_025
    symptom: "A thermal-stress run gives a displacement field of the right shape and the wrong magnitude."
    remedy: "Use an identical *.man for both passes; *.oit is a positional binary stream."
  - id: dt_026
    symptom: "Exit status 0 and a full set of results, with 'not converged for checki' buried in 1.chk."
    remedy: "Always parse 1.chk; raise miter, cut ditime, or switch type_nl from 5 to 4."
  - id: dt_027
    symptom: "A back analysis recovers the target parameters to six digits and is reported as validation."
    remedy: "Use measured monitoring series; label a Bparameter=-1 run as validation tier `synthetic`."
  - id: dt_028
    symptom: "A re-run produces the previous run's answer, or restarts from an unrelated state."
    remedy: "Never run twice in the same directory; run_hstar.py copies the case to a fresh workspace each time."
  - id: dt_029
    symptom: "A model with the reservoir surface near -99 m shows no uplift although upliftin=1."
    remedy: "Shift the mesh datum; -99.0 is HSTAR's sentinel for 'no reservoir'."
  - id: dt_030
    symptom: "A staged run completes block 1 and then hits end-of-file on unit 4, 21 or 9."
    remedy: "Repeat .pre, .loa and .man once per run block; write_stages.py --replicate does it and verifies the counts."
  - id: dt_031
    symptom: "A prescribed non-zero temperature or settlement behaves as if it were zero."
    remedy: "val_fix multiplies its time curve; use a flat curve or itcurve=0 for a constant value."
  - id: dt_032
    symptom: "The run allocates many gigabytes and thrashes or dies with insufficient virtual memory."
    remedy: "Switch type_solver from PROFILE to PARDISO above roughly 5e4 degrees of freedom."
