# HSTAR — KI manifest.
#
# PROVENANCE: the toolkit's generate_ki_manifest.py is not installed on this
# host (/mnt/disk1/Hydrocraft_server/ does not exist), so this file was
# projected by hand from dag.yaml and the KI's actual contents, following the
# de-facto shape the generator emits. Every count below was measured, not
# asserted -- re-measure after any change to dag.yaml, tools/ or triplets.
#
#   tools:            21   (ls tools/*.py)
#   docs (markdown):  12
#   triplets:         32   (top-level list in diagnostics/triplets.yaml)
#   dag outputs:      15   (8 observable + 7 secondary)
#   papers retrieved: 23   (+ 40 recorded-but-unreadable)

package:
  name: HSTAR
  version: source revisions through 2025-07 (no version string in the code)
  language: fortran90
  domain: structural_fem
  lineage: >
    Descendant of GEHOMadrid (M. Pastor, Tonchun Li, P. Mira, 1997); Hohai
    University fork.
  build_system: >
    None shipped. Visual Studio / Intel Fortran project (hstar.vfproj) for
    Windows; this KI reproduces the link line on Linux with Intel ifx + oneMKL
    via tools/build_hstar.py.
  compilation_units: 17
  source_lines: ~80000
  binary_interface: >
    No command-line arguments. Reads `inp` from the current working directory
    (Fem.f90:90); the GETARG block at Fem.f90:96-101 is commented out.
  dissected: 2026-08-26

pipeline:
  stages:
    - id: s0_build
      name: Build the solver
      tools: [build_hstar.py]
      doc: docs/s0_build.md
    - id: s1_case_setup
      name: Clone a template and set analysis control
      tools: [make_case.py, set_analysis.py]
      doc: docs/s1_case_setup.md
      depends_on: [s0_build]
    - id: s2_mesh
      name: Coordinates, connectivity and element groups
      tools: [write_mesh.py]
      doc: docs/s2_mesh.md
      depends_on: [s1_case_setup]
    - id: s3_boundary_conditions
      name: Kinematic and field Dirichlet conditions
      tools: [write_boundary.py]
      doc: docs/s3_loads_and_bcs.md
      depends_on: [s2_mesh]
    - id: s4_materials
      name: Constitutive models and parameters
      tools: [write_materials.py]
      doc: docs/s4_materials.md
      depends_on: [s2_mesh]
    - id: s5_loads
      name: Time curves, point / face / body loads
      tools: [write_loads.py]
      doc: docs/s3_loads_and_bcs.md
      depends_on: [s2_mesh, s3_boundary_conditions]
    - id: s6_thermal_and_seepage
      name: Thermal field, thermal stress, seepage, uplift, cooling pipes
      tools: [write_thermal.py, write_seepage.py]
      doc: docs/s6_thermal_and_seepage.md
      depends_on: [s4_materials, s5_loads]
    - id: s7_load_steps
      name: Load-step and time-step control
      tools: [write_steps.py]
      doc: docs/s3_loads_and_bcs.md
      depends_on: [s5_loads]
    - id: s8_capabilities
      name: Staging, contact and joints, reinforcement, reservoir interaction
      tools: [write_stages.py, write_contact.py, write_reinforcement.py,
              write_ifs.py]
      doc: docs/s8_contact_and_stages.md
      depends_on: [s4_materials, s7_load_steps]
    - id: s9_execution
      name: Run the binary in an isolated workspace
      tools: [run_hstar.py]
      doc: docs/s5_execution.md
      depends_on: [s6_thermal_and_seepage, s8_capabilities]
    - id: s10_postprocessing
      name: Parse the result files
      tools: [parse_results.py]
      doc: docs/s7_postprocessing.md
      depends_on: [s9_execution]
    - id: s11_validation
      name: Run health, plausibility, equilibrium, benchmark
      tools: [validate_results.py]
      doc: docs/s7_postprocessing.md
      depends_on: [s10_postprocessing]
    - id: s12_inversion_and_reliability
      name: Parameter inversion and FORM reliability
      tools: [write_inverse.py, write_reliability.py]
      doc: docs/s9_inversion_and_reliability.md
      depends_on: [s11_validation]

validation:
  tier: analytic
  tier_justification: >
    Compared against two closed-form elasticity solutions and a four-level
    mesh-convergence study, using the model's real compiled binary driven end to
    end by this KI's own tools. NOT `real`: no independent observed data was
    used. NOT `synthetic`: the references are exact analytic solutions, not
    self-generated model output.
  benchmark: >
    (1) 1-D confined (oedometer) compression under self weight:
        sigma_yy(y) = -rho*g*(H-y); u_y(y) = -(rho*g/M)(H*y - y^2/2) with
        M = E(1-nu)/((1+nu)(1-2nu)). 1x20 Q4, plane strain.
    (2) Lame thick-walled cylinder under internal pressure, plane strain:
        u_r(r) = (1+nu)*p_i*a^2/(E*(b^2-a^2)) * ((1-2nu)*r + b^2/r).
        Quarter annulus a=1 m, b=2 m, p_i=1 MPa, E=25 GPa, nu=0.2.
    (3) Mesh convergence on (2): 4x4, 8x8, 16x16, 32x32.
    (4) Regression: the shipped `lame_cylinder` case reproduced bit-for-bit by
        the Linux build against its stored reference result.
  metrics:
    confined_column:
      max_relative_error: 1.60e-16
      nse: 1.000000
      rmse_m: 3.64e-21
      pbias_percent: 8.39e-15
      n_nodes: 42
      note: >
        Linear elements are exact at the nodes for this problem, so the residual
        is round-off, not discretisation error.
    lame_cylinder_8x8:
      max_relative_error: 4.66e-03
      nse: 0.998865
      r: 0.99999996
      rmse_m: 2.42e-07
      n_nodes: 81
    mesh_convergence_max_relative_error:
      "4x4": 1.844e-02
      "8x8": 4.662e-03
      "16x16": 1.169e-03
      "32x32": 2.925e-04
    observed_order_of_accuracy: [1.984, 1.996, 1.999]
    expected_order_of_accuracy: 2.0
    global_equilibrium_relative_residual: 9.77e-05
    equilibrium_note: >
      Reactions 2.35417e5 N against an applied self weight of 2.35440e5 N; the
      residual is entirely accounted for by the five-significant-figure print
      format of *.act.
  figure: work/figures/s8_validation.png
  convention: docs/validation_convention.yaml
  bugs_found_during_validation:
    - "*.man increment record needs 9 fields (…nresta cwater Qstatic); static_U
       at Fem.f90:3590 reads Qstatic. An 8-field record makes the list-directed
       read swallow the tolerance record -> forrtl severe (24) on unit 9.
       Triplet dt_016."
    - "*.loa face-class record needs 4 fields (sedge nnode index vdimn);
       Load.f90:359 added vdimn on 2021-10-28. Triplet dt_023."
    - "*.loa edge-load group record needs 5 fields (begin end itcurve water
       code_load); Load.f90:748. Triplet dt_024."

environment:
  binary_verified: /tmp/claude-1000/kdt-single-out/work/bin/hstar
  compiler: Intel ifx 2025.3
  math_library: Intel oneMKL 2026.0
  platform: linux x86-64
  windows_dependencies_handled:
    gidpost: replaced by a C stub; safe while outplot is GIDR/GIDA
    hdf5_zlib: dropped -- no HDF5 call exists in the Fortran sources
  shared_library_absent:
    ki_tools_common: >
      /mnt/disk1/Hydrocraft_server/ does not exist on this host. tools/
      hstar_common.py imports the upstream all_metrics when available and
      otherwise uses a documented local fallback. The forcing loaders, HWSD
      lookup, ROSETTA and land-cover crosswalk are not applicable to a
      structural FEM code; validate_water_balance has no meaning here and its
      structural analogue -- global static equilibrium -- is implemented as
      check_equilibrium().
    knowledge_dissection_toolkit: >
      /home/server/knowledge-dissection-toolkit does not exist, so
      generate_skill_map.py, generate_ki_manifest.py, generate_format_spec.py,
      ki_dag_generator, openalex_search.py, paper_fetch.py, stepb_* and
      verify_ki_structure.py could not be run. The artefacts they would have
      produced were authored by hand against the documented shapes and are
      labelled as such in each file's header.

tools:
  count: 21
  shared:
    - {name: hstar_io.py, role: "record tokenising with Fortran repeat-count
       expansion, anchored .glb editing, template cloning; --selftest"}
    - {name: hstar_common.py, role: "metrics, global-equilibrium check,
       displacement plausibility check; --selftest"}
  build_and_run:
    - {name: build_hstar.py, stage: s0_build}
    - {name: run_hstar.py, stage: s9_execution}
  ingestion:
    - {name: make_case.py, stage: s1_case_setup}
    - {name: set_analysis.py, stage: s1_case_setup}
    - {name: write_mesh.py, stage: s2_mesh}
    - {name: write_boundary.py, stage: s3_boundary_conditions}
    - {name: write_materials.py, stage: s4_materials}
    - {name: write_loads.py, stage: s5_loads}
    - {name: write_steps.py, stage: s7_load_steps}
    - {name: write_thermal.py, stage: s6_thermal_and_seepage}
    - {name: write_seepage.py, stage: s6_thermal_and_seepage}
    - {name: write_stages.py, stage: s8_capabilities}
    - {name: write_contact.py, stage: s8_capabilities}
    - {name: write_reinforcement.py, stage: s8_capabilities}
    - {name: write_ifs.py, stage: s8_capabilities}
    - {name: write_inverse.py, stage: s12_inversion_and_reliability}
    - {name: write_reliability.py, stage: s12_inversion_and_reliability}
  parsing_and_validation:
    - {name: parse_results.py, stage: s10_postprocessing}
    - {name: validate_results.py, stage: s11_validation}

inputs:
  mandatory_files: [inp, 1.glb, 1.cor, 1.ele, 1.pre, 1.mat, 1.loa, 1.man,
                    1.opr, 1.sol, 1.tem, 1.ifs, 1.nrt, 1.ftr]
  optional_files: [1.oit, 1.oip, 1.ini, 1.rtt, 1.btl, 1.obs, 1.sto, 1.aqu,
                   1.stn, 1.upf, 1.msh, 1.vcor]
  forcing_count: 9
  parameter_count: 22
  format: >
    All text inputs are read list-directed (read(unit,*)). Columns are free;
    record count and token order are rigid. Heading records are positional.
  spec: docs/format_spec.yaml

outputs:
  observable_count: 8
  secondary_count: 7
  headline: {name: displacement_field, unit: m, validation_rank: 1,
             emitted_in: "*.flavia.res block DISPLACEMENT"}
  files: [1.flavia.res, 1.flavia.msh, 1.gpv, 1.act, 1.chk, 1.opw, 1.oew,
          1.ogw, 1.ojw, 1.ctr, 1.gdm, 1.bar, 1.res, 1.resb, 1.oit, 1.oip,
          1.rtt, 1.fai, 1.upf]
  spec: docs/format_spec.yaml

diagnostics:
  file: diagnostics/triplets.yaml
  format: top-level YAML list
  count: 32
  id_range: dt_001 .. dt_032
  severity_breakdown: {fatal: 12, silent: 14, degraded: 5, warning: 1}
  verified_by_crashing_this_build: [dt_016, dt_023, dt_024]

literature:
  index: docs/papers_index.md
  retrieved: 23
  recorded_unreadable: 40
  gathered_via: >
    OpenAlex API directly (the toolkit's openalex_search.py / paper_fetch.py are
    not installed here). Every text_path was verified to exist on disk.
  primary_sources_not_online:
    - "GEHOMadrid 程序使用说明 (Beta 1.0), Institute of Hydraulic Structures,
       Hohai University, April 2004"
    - "GEHOMadrid 温度场及温度应力场计算说明, same institute"

capabilities:
  count: 21
  primary: static stress analysis, linear and material-nonlinear
  list: [static_stress, time_dependent, transient_dynamics, response_spectrum,
         modal_extraction, thermal_field, thermal_stress_coupling, seepage,
         uplift, staged_construction, contact_and_joints, safety_factor,
         concrete_damage_and_creep, reinforcement_and_bond, cooling_pipes,
         fluid_structure_interaction, parameter_inversion, reliability,
         adaptive_mesh_and_submodel, restart, level_set]
