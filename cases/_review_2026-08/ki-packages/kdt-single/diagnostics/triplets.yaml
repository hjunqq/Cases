- id: dt_001
  name: HSTAR ignores command-line arguments
  symptom: "The binary is launched as `hstar mycase` or `hstar /path/1` and it either reports `Input the problem name?` and then dies on a missing `.glb`, or silently analyses a completely different case."
  diagnosis: "`Fem.f90:96-101` shows the `CALL GETARG` block commented out. The only run selector is the file `inp` in the CURRENT WORKING DIRECTORY: record 4 is the problem-name prefix and record 5 is `runblks`. All ~40 data files are opened relative to CWD."
  remedy: "Always `cd` into the case directory and run the bare binary, with `inp` record 4 set to `1`. `tools/run_hstar.py` enforces this: it copies the case to a temp workspace, patches `inp`, and runs with `cwd=workspace`."
  severity: fatal
  stage: s9_execution
  failure_domain: configuration
  detection: "grep -n 'GETARG' Fem.f90   # every occurrence is commented out"
  cross_references: [docs/s5_execution.md, dt_002]

- id: dt_002
  name: gfortran cannot build HSTAR
  symptom: "`gfortran -c Global.f90` fails with `Unexpected element in format string` / `Syntax error in OPEN statement` around `FORM='BINARY'`, `buffered='YES'`, `blocksize=1048576`, or with unresolved `MKL_RCI`, `MKL_VSL` module references."
  diagnosis: "HSTAR uses Intel-specific Fortran extensions and links MKL's RCI trust-region and VSL random-number modules. `FORM='BINARY'` and the `buffered=`/`blocksize=` OPEN specifiers are Intel-only; `include 'mkl_rci.f90'` at Fem.f90:1 needs the MKL Fortran include directory."
  remedy: "Build with Intel `ifx` (or `ifort`) and oneMKL. `tools/build_hstar.py` finds them, compiles the 17 units in use-graph order, and links `-lmkl_intel_lp64 -lmkl_intel_thread -lmkl_core -liomp5`. Run `python3 tools/build_hstar.py --check-only` first to see what is missing."
  severity: fatal
  stage: s0_build
  failure_domain: dependency
  detection: "python3 tools/build_hstar.py --check-only"
  cross_references: [docs/s0_build.md, dt_003]

- id: dt_003
  name: unresolved GiD_* symbols at link time
  symptom: "Linking fails with `undefined reference to GiD_OpenPostMeshFile`, `GiD_BeginScalarResult`, `GiD_WriteCoordinates` and about thirty similar `GiD_*` names."
  diagnosis: "`gidpost.F90` is a Fortran binding to the GiD post-processing C library, shipped on Windows only as `lib64/gidpost.lib`. There is no Linux build in the source tree. Only the BINARY post-processing path calls into it (`OUT_GID_BIN_MESH`, `GiD_Begin*Result`); the ASCII writers used by `outplot='GIDR'`/`'GIDA'` write with plain Fortran `write` statements."
  remedy: "Link a C stub that defines the exported symbols. `tools/build_hstar.py` compiles `gidpost_stub.c` and links it. Keep `outplot='GIDR'` or `'GIDA'` in the `.glb` so the stub is never actually entered; `'GIDB'`/`'GIDL'` would call it and produce an empty result file."
  severity: fatal
  stage: s0_build
  failure_domain: dependency
  detection: "nm -u build/*.o | grep -c GiD_"
  cross_references: [dt_002, dt_015]

- id: dt_004
  name: "`.glb` heading record deleted or added, whole file misparsed"
  symptom: "The run stops almost immediately with `forrtl: severe (24): end-of-file during read, unit 1`, or it completes but `1.chk` echoes nonsense such as `type_problem = 0.5` and `nblks = 99999`."
  diagnosis: "`read(gunit,*)text` at ~40 places in `Global.f90` consumes one whole record and discards it. Heading records are POSITIONAL, not parsed. Removing a heading (or the placeholder records `valv1` and `ndivide` at Global.f90:690-696) shifts every subsequent read by one record, so integers are read where characters were expected and vice versa."
  remedy: "Never author a `.glb` from scratch. Clone a working template with `tools/make_case.py` and change values with `tools/set_analysis.py`, which locates a heading by substring and replaces one token of the record below it, preserving the token count."
  severity: fatal
  stage: s3_analysis_control
  failure_domain: configuration
  detection: "diff <(grep -c . case/1.glb) <(grep -c . templates/static_2d/1.glb)"
  cross_references: [docs/s1_case_setup.md, dt_005]

- id: dt_005
  name: anchored edit fails because the template is a different vintage
  symptom: "A tool exits with `KeyError: heading record 'ECWPIPE' not found in 1.glb`."
  diagnosis: "HSTAR's `.glb` grew over two decades; older cases lack the later records (`ECWPIPE`, `nflow`, `ninistn`, `stab_matde`, `liquj`). The heading text is the anchor, so a pre-2020 case file genuinely has no such record and the current binary will hit EOF reading it anyway."
  remedy: "Migrate the case to a current template: clone `templates/static_2d` and port the values across, rather than patching the old file. If the old file must be kept, add the missing heading AND its data record in the position `Global.f90` reads them."
  severity: fatal
  stage: s1_case_setup
  failure_domain: configuration
  detection: "python3 -c \"from tools.hstar_io import GlbFile; GlbFile('case/1.glb').find_heading('ECWPIPE')\""
  cross_references: [dt_004]

- id: dt_006
  name: element name and library index disagree
  symptom: "The run aborts inside `read_element` with an array-bounds error, or converges to a displacement field that is smooth but far too stiff or far too soft."
  diagnosis: "The group stanza carries BOTH a name (`Q4`) and a library index (`5`). `Elements.f90:1068` uses the INDEX to look up node count and shape functions; the name is only echoed. Writing `Q4` with index `9` makes HSTAR read 8 nodes per element from a 4-node connectivity table."
  remedy: "Use the index table in `docs/input_preparation.md` §5. `tools/write_mesh.py` sets name and index together from `ELEMENT_TABLE` and cannot desynchronise them."
  severity: fatal
  stage: s2_mesh
  failure_domain: configuration
  detection: "awk '/for each field/{getline; print $1, $3}' case/1.glb"
  cross_references: [docs/s2_mesh.md, dt_007]

- id: dt_007
  name: elements not sorted by group
  symptom: "The run completes, but a construction stage that should be inactive still carries stress, or `1.chk` reports a group volume (`tvol`) that does not match the geometry."
  diagnosis: "The manual (§3.4) requires elements listed in ascending group order with no interleaving; `read_element` (Elements.f90:1048) walks the `.ele` file group by group and assigns elements to whichever group it is currently filling. An out-of-order record is silently attributed to the wrong group, so `APPEAR_PROCESS` then switches off the wrong elements."
  remedy: "Sort `.ele` by group before writing. `tools/write_mesh.py` asserts the ordering and refuses to write an unsorted table."
  severity: silent
  stage: s2_mesh
  failure_domain: configuration
  detection: "awk '{print $NF}' case/1.ele | sort -c -n && echo sorted"
  cross_references: [dt_006, dt_016]

- id: dt_008
  name: clockwise element connectivity gives a negative Jacobian
  symptom: "`1.chk` reports `SINGULAR` or a zero/negative pivot, or the PARDISO path returns error -4; alternatively the stress field has the right magnitude and the wrong sign in patches of the mesh."
  diagnosis: "HSTAR does not check element orientation. A 2-D element whose nodes are listed clockwise has a negative Jacobian determinant, which flips the sign of its contribution to the stiffness matrix and to the body-force vector."
  remedy: "List 2-D element nodes counter-clockwise and 3-D hexahedra with the standard bottom-then-top ordering. `tools/write_mesh.py` computes the signed area of every quad/triangle and refuses to write a non-positive one."
  severity: fatal
  stage: s2_mesh
  failure_domain: configuration
  detection: "python3 tools/write_mesh.py --case c1 --from-flavia c1/1.flavia.msh   # runs the orientation check"
  cross_references: [dt_012]

- id: dt_009
  name: boundary conditions given as a literal node list
  symptom: "After a remesh or a node renumbering the model appears far too flexible, rotates as a rigid body, or the solver reports a singular matrix — with no change to the material or the load."
  diagnosis: "`.pre` sets identify nodes by integer id. Nothing ties those ids to geometry, so any change to the mesh silently moves the constraints somewhere else."
  remedy: "Select constrained nodes by coordinate predicate, not by id. `tools/write_boundary.py --fix \"dof=2;where=y<1e-9\"` re-derives the list from `.cor` every time the mesh changes."
  severity: silent
  stage: s4_boundary_conditions
  failure_domain: configuration
  detection: "python3 tools/write_boundary.py --case c1 --fix \"dof=2;where=y<1e-9\"   # prints the node count it selected"
  cross_references: [docs/s3_loads_and_bcs.md, dt_012]

- id: dt_010
  name: "Young's modulus in MPa instead of Pa"
  symptom: "The run converges in two iterations with a tiny residual and reports displacements of metres or tens of metres for a structure that should move millimetres."
  diagnosis: "HSTAR performs no unit conversion anywhere. Displacement scales as 1/E for a linear elastic solid, so an E of 25000 (MPa) instead of 2.5e10 (Pa) inflates every displacement by exactly 1e6 while leaving the convergence behaviour untouched."
  remedy: "Give E, cohesion, tensile strength and every pressure in pascals. `tools/write_materials.py` range-checks E to 1e4..1e12 Pa and density to 500..12000 kg/m3; `tools/validate_results.py --model-size L` flags |u|max above L/10."
  severity: silent
  stage: s6_materials
  failure_domain: unit_conversion
  detection: "python3 tools/validate_results.py --output_dir out --model-size <characteristic length in m>"
  cross_references: [docs/s4_materials.md, dt_011]

- id: dt_011
  name: "thermal diffusivity in m2/s while the time step counts days"
  symptom: "A transient thermal run reaches the ambient temperature everywhere in one or two steps and then stays flat; the interior of a 20 m concrete block shows no hydration peak at all."
  diagnosis: "`*.mat` `'HEAT','SOLID'` expects diffusivity per DAY, matching `ditime` in `*.man` which the thermal manual specifies in days. Concrete is a ~0.0864 m2/day, i.e. 1.0e-6 m2/s. Supplying 1.0e-6 with day-based steps under-diffuses by 86400x; supplying 0.0864 with second-based steps over-diffuses by the same factor. Either way the run converges."
  remedy: "Keep both in days. `tools/write_materials.py` range-checks `a` to 1e-4..1 m2/day, and `tools/write_thermal.py` repeats the check before writing the field pass."
  severity: silent
  stage: s6_materials
  failure_domain: unit_conversion
  detection: "python3 tools/write_thermal.py --case c1 --field-pass --diffusivity <a>   # blocks on an out-of-range value"
  cross_references: [docs/s6_thermal_and_seepage.md, dt_010, dt_025]

- id: dt_012
  name: structure not restrained against rigid-body motion
  symptom: "`1.chk` shows a zero or negative pivot from the PROFILE skyline factorisation, or PARDISO returns error -4; with an iterative solver the residual stalls at O(1)."
  diagnosis: "The stiffness matrix of an unconstrained elastic body is singular in its rigid-body modes: 3 in 2-D, 6 in 3-D. HSTAR assembles it regardless and lets the solver discover the problem."
  remedy: "Constrain every active translational DOF somewhere. `tools/write_boundary.py` refuses to write a `.pre` that leaves a translational DOF entirely free and names the missing direction."
  severity: fatal
  stage: s4_boundary_conditions
  failure_domain: configuration
  detection: "grep -i 'singular\\|pivot' case/1.chk"
  cross_references: [dt_008, dt_009]

- id: dt_013
  name: the load never reaches the mesh
  symptom: "A converged run with a smooth, plausible field — and a displacement magnitude an order of magnitude too small, or exactly zero."
  diagnosis: "Three independent ways to lose a load, none of which is an error: (a) the face list in `.loa` matched no boundary faces, so `edge_load_group=0`; (b) `tcurvegravity` for the group is 0, which disables self-weight for that group; (c) the group is switched off in `APPEAR_PROCESS` for this run block."
  remedy: "Check global equilibrium: the sum of the reactions written to `.act` must cancel the applied resultant. `tools/validate_results.py` runs this check automatically for self-weight cases; `tools/write_loads.py` blocks an edge-load group whose face list is empty."
  severity: silent
  stage: s5_loads
  failure_domain: validation
  detection: "python3 tools/validate_results.py --output_dir out --case c1   # equilibrium layer"
  cross_references: [docs/s3_loads_and_bcs.md, dt_016]

- id: dt_014
  name: "element library index 22 is claimed twice"
  symptom: "A `p4` reservoir-pressure element behaves like a `thin_film` element (or the reverse): the fluid-structure coupling term vanishes, or a thin-film group produces pressure degrees of freedom."
  diagnosis: "`Elements.f90:931` sets `p4%index=22` and `Elements.f90:958` sets `thin_film%index=22`. `kinddefine` fills `elkn(22)` with `p4` and then `elkn(26)` with `thin_film`, but `thin_film_define` also writes index 22 into its own record. `modf_element_lib` (called from Fem.f90:184) reconciles this at run time; a case that bypasses it inherits whichever definition was written last."
  remedy: "Declare thin-film groups with index 26 and reservoir pressure elements with index 22, and never rely on the name alone. Verify with `1.chk`, which echoes the resolved index per group."
  severity: silent
  stage: s2_mesh
  failure_domain: configuration
  detection: "grep -n \"index=22\" Elements.f90"
  cross_references: [dt_006]

- id: dt_015
  name: no result file is written although the run succeeded
  symptom: "Exit status 0, `1.chk` full of healthy convergence ratios, and `1.flavia.res` is empty or absent."
  diagnosis: "Two independent gates. `gid_u`/`gid_s` and the other 18 flags in `.glb` decide WHICH blocks are written; `noutf` in `.man` decides HOW OFTEN. If `noutf > nstep` no output step is ever reached. `outplot='GIDB'`/`'GIDL'` route the writing through the gidpost C library, which is a stub in this Linux build."
  remedy: "Set `gid_u=1 gid_s=1` (at least), `noutf=1`, and keep `outplot='GIDR'` or `'GIDA'`. `tools/write_steps.py` blocks `noutf<1`; `tools/parse_results.py` names this cause when it finds no blocks."
  severity: degraded
  stage: s10_postprocessing
  failure_domain: configuration
  detection: "python3 tools/parse_results.py --output_dir out --summary"
  cross_references: [docs/s7_postprocessing.md, dt_003]

- id: dt_016
  name: "`.man` increment record has 8 fields instead of 9"
  symptom: "`forrtl: severe (24): end-of-file during read, unit 9, file <case>/1.man`, immediately after `1.chk` prints ` in static_U**`."
  diagnosis: "The GEHOMadrid manual documents a 7-field record. HSTAR added `cwater` (8th, Fem.f90:2405) and then `Qstatic` (9th, Fem.f90:3590 in `static_U`, the routine every `type_problem='Q'` run passes through). A list-directed read whose I/O list outruns the record CONTINUES ONTO THE NEXT RECORD, so an 8-field record makes `static_U` consume the tolerance record looking for `Qstatic` and then hit EOF. VERIFIED on this KI's build, 2026-08-26."
  remedy: "Always write nine fields — `miter ditime noutn noutf nstep inc_step nresta cwater Qstatic`. The 8-field readers discard the surplus token harmlessly. `tools/write_steps.py` emits nine."
  severity: fatal
  stage: s7_load_steps
  failure_domain: configuration
  detection: "awk 'NR==3{print NF}' case/1.man   # must print 9 or more"
  cross_references: [docs/s3_loads_and_bcs.md, dt_023, dt_024]

- id: dt_017
  name: "U-P coupling requested on a single-field element"
  symptom: "A Biot consolidation run produces displacements but the pore-pressure block is absent from `1.flavia.res`, or `1.chk` reports `ntotv` far smaller than `npoin*(ndimn+1)`."
  diagnosis: "Pore pressure is the SECOND field of a two-field element. Only the `*cN` library entries carry it — `t6c3`(11) `q8c4`(12) `h10c4`(13) `b20c8`(14) `t3c3`(15) `q4c4`(16) `h4c4`(17) `b8c8`(18) `l2c2`(19) `b2c2`(21) `pr6c6`(24). A plain `q4`(5) group with `fieldid='UW'` allocates no pressure degrees of freedom."
  remedy: "Use the matching two-field element and set `nrfields=2`, `fieldid='UW'` with DOF lists `(1..ndimn)` and `(8)`. `tools/write_seepage.py --mode coupled --etype q4c4` enforces the pairing."
  severity: degraded
  stage: s6_thermal_and_seepage
  failure_domain: grid_coupling
  detection: "python3 tools/write_seepage.py --case c1 --mode coupled --etype q4"
  cross_references: [docs/s6_thermal_and_seepage.md, dt_006]

- id: dt_018
  name: joint declared as GOODMAN with no GOODMAN material
  symptom: "A contact or construction joint never opens: the normal gap stays at its initial value through the whole load history and `1.gdm` is empty or constant."
  diagnosis: "`gaps%goodman=1` in the `.glb` contact block only selects the ELEMENT behaviour. The stress-dependent stiffness law lives in the `.mat` entry `GOODMAN`/`JANBU`. Without it the group falls back to the continuum constitutive law assigned by `matno`, which has no tensile cut-off."
  remedy: "Declare a `GOODMAN` material with the `JANBU` parameter set and point the joint group's `matno` at it. `tools/write_contact.py` cross-checks the `.mat` before writing and blocks the mismatch."
  severity: silent
  stage: s8_contact
  failure_domain: configuration
  detection: "grep -c GOODMAN case/1.mat"
  cross_references: [docs/s8_contact_and_stages.md, dt_010]

- id: dt_019
  name: absorbing boundary reflects because the far-field density is wrong
  symptom: "A transient dynamic run shows the incident wave returning from the model edge; the response does not decay and late-time amplitudes grow instead of dying away."
  diagnosis: "The viscous (VIE) boundary sizes its dashpots from the far-field impedance rho*c, with c derived from `exx` and `uxx` on the `nabssgroup` record of `*.ifs`. A wrong density or modulus mistunes the impedance and the boundary partially reflects. Nothing warns, because the run is perfectly stable."
  remedy: "Set `exx`, `uxx`, `densxx` to the properties of the material actually adjacent to the boundary, and set `type_ABC='VIE'` in `.glb`. `tools/write_ifs.py --absorbing` range-checks the density and requires a wave-type `type_problem`."
  severity: silent
  stage: s8_dynamics
  failure_domain: grid_coupling
  detection: "python3 tools/parse_results.py --output_dir out --var DISPLACEMENT   # compare early vs late |u|max"
  cross_references: [dt_026]

- id: dt_020
  name: bond slip requested but ikindks is zero
  symptom: "A reinforced-concrete run converges, the bar axial force in `*.bar` looks reasonable, and the reported slip is identically zero at every step."
  diagnosis: "`ikindsc` in the `nrcsteel` stanza selects the bond-slip law, but `steel_spring_parameter` — the routine that builds the bond springs — is only called when `ikindks/=0` (Fem.f90:1860, from the `ftcrack,coefMpa,ikindks,...` record). With `ikindks=0` the steel nodes are tied rigidly to the concrete."
  remedy: "Set `ikindks` to the intended spring model as well as `ikindsc`. `tools/write_reinforcement.py` blocks the combination of a non-zero bond law with `ikindks=0`."
  severity: silent
  stage: s8_reinforcement
  failure_domain: configuration
  detection: "awk '/ftcrack,coefMpa/{getline; print $3}' case/1.glb"
  cross_references: [docs/s8_contact_and_stages.md]

- id: dt_021
  name: inversion Jacobian is ill-conditioned because parameters are unscaled
  symptom: "The trust-region back analysis takes its full iteration budget without reducing the residual, or reports `RCI_REQUEST` failures; the recovered Poisson ratio moves by 1e-9 while the modulus swings wildly."
  diagnosis: "`*.btl` inverts a raw parameter vector. Mixing an elastic modulus of 2e10 with a Poisson ratio of 0.2 gives a Jacobian whose columns differ by eleven orders of magnitude, so a single trust-region radius cannot serve both. The `factor` column of the parameter record exists exactly to rescale them."
  remedy: "Choose `factor` so every parameter maps into roughly 1e-2..1e2 (e.g. 1e-10 for a modulus). `tools/write_inverse.py` computes the scaled magnitude and blocks anything outside that band."
  severity: degraded
  stage: s11_inversion
  failure_domain: configuration
  detection: "python3 tools/write_inverse.py --case c1 --param \"imat=1;name=E;init=2e10;factor=1\""
  cross_references: [docs/s9_inversion_and_reliability.md, dt_027]

- id: dt_022
  name: reliability correlation matrix is not positive definite
  symptom: "The FORM iteration in a `relis=1` run oscillates and hits `mkiter` without converging, or reports a negative reliability index for a clearly safe structure."
  diagnosis: "`*.sto` supplies the correlation matrix as free-form records and HSTAR does not check it. A matrix that is asymmetric, has an off-diagonal magnitude above 1, or is merely indefinite makes the Nataf transform produce a meaningless search direction in standard normal space."
  remedy: "Supply a symmetric matrix with a unit diagonal that passes a Cholesky factorisation. `tools/write_reliability.py` checks symmetry, the diagonal and positive definiteness before writing."
  severity: degraded
  stage: s9_reliability
  failure_domain: configuration
  detection: "python3 tools/write_reliability.py --case c1 --var ... --corr \"1,0.9|0.9,1\""
  cross_references: [docs/s9_inversion_and_reliability.md]

- id: dt_023
  name: "`.loa` face-class record has 3 fields instead of 4"
  symptom: "`forrtl: severe (59): list-directed I/O syntax error, unit 21, file <case>/1.loa`, printed right after `nedge= <n>`."
  diagnosis: "The manual documents `sedge, nnode, index`. `Load.f90:359` reads `sedge, nnode, index, vdimn` — `vdimn` was added on 2021-10-28 to allow a planar projection of the face Jacobian. A 3-field record makes the reader take the first face record's leading token as `vdimn`, after which every face record is off by one and a heading token eventually reaches an integer read. VERIFIED on this KI's build, 2026-08-26."
  remedy: "Write four fields, with `vdimn=0` for the ordinary case. `tools/write_loads.py` does."
  severity: fatal
  stage: s5_loads
  failure_domain: configuration
  detection: "grep -A1 'sedge,nnode' case/1.loa | awk 'NR==2{print NF}'   # must be 4"
  cross_references: [dt_016, dt_024]

- id: dt_024
  name: "`.loa` edge-load group record has 4 fields instead of 5"
  symptom: "List-directed syntax error on unit 21 after `edge_load_group= <n> delgroup= <m>`, or a pressure that is applied to the wrong range of faces."
  diagnosis: "The manual documents `begin_edge, end_edge, itcurve, water`. `Load.f90:748` reads a fifth field `code_load`; when it is non-zero a SECOND `cor0 cor1 p0 p1 fact` record follows, describing the load on the far side of the face. A 4-field record makes the reader take `cor0` as `code_load`."
  remedy: "Write five fields, with `code_load=0` unless a two-sided face load is intended. `tools/write_loads.py` does."
  severity: fatal
  stage: s5_loads
  failure_domain: configuration
  detection: "grep -A2 'edge_load_group,delgroup' case/1.loa"
  cross_references: [dt_023]

- id: dt_025
  name: "thermal-stress pass reads the wrong `*.oit` record"
  symptom: "A thermal-stress run converges and produces a temperature-driven displacement field whose shape is right and whose magnitude is wrong, or whose sign reverses part-way through the history."
  diagnosis: "`*.oit` is an unformatted positional stream of nodal delta-T, one block per output step of the thermal pass. The stress pass walks it step by step. If the two passes use different `nstep`, `ditime` or `nincs`, step k of the stress pass reads step j of the thermal pass. Nothing checks the alignment. The thermal manual (part 2 §6) states the requirement explicitly."
  remedy: "Use an identical `*.man` for both passes; when the stress pass needs an extra leading run block for the foundation, prepend a zero-duration block rather than editing the existing ones. `tools/write_thermal.py --stress-pass --ref-man <thermal .man>` compares the two token-wise and blocks a mismatch."
  severity: silent
  stage: s6_thermal_and_seepage
  failure_domain: initial_conditions
  detection: "diff <(tr -s ' ' '\\n' < thermal/1.man) <(tr -s ' ' '\\n' < stress/1.man)"
  cross_references: [docs/s6_thermal_and_seepage.md, dt_011]

- id: dt_026
  name: non-convergence is reported but not fatal
  symptom: "The run finishes with exit status 0 and a full set of result files; buried in `1.chk` are lines reading `not converged for checki= 1` at several load steps."
  diagnosis: "When the iteration counter reaches `miter` without meeting `toler_force`, HSTAR prints the warning and moves to the next load step with whatever state it has. The manual says so plainly: `当迭代达到此值时还不收敛，直接进入下一荷载步的计算，结果可能不正确`. Nothing in the exit status or the result files records it."
  remedy: "Always parse `1.chk`. `tools/parse_results.py` reports `convergence.not_converged` and the final residual ratios; `tools/validate_results.py` fails its run_health layer when the final force ratio is not small. Raise `miter`, cut `ditime`, or switch `type_nl` from 5 (modified Newton) to 4 (full Newton)."
  severity: silent
  stage: s9_execution
  failure_domain: runtime
  detection: "grep -c 'not converged' case/1.chk"
  cross_references: [docs/s5_execution.md, dt_013]

- id: dt_027
  name: inversion run against synthetic observations proves nothing
  symptom: "A back analysis recovers the target parameters to six digits and the report claims the model is validated."
  diagnosis: "If the `*.obs` series was produced by the same model with the same mesh, the inversion is solving an exactly consistent system; the recovered parameters are the ones used to generate the data by construction. This is a pipeline test, not a validation. HSTAR's own `Bparameter=-1/-2` mode exists to do exactly this deliberately, as a plumbing check."
  remedy: "Use measured monitoring series (plumb lines, extensometers, thermometers). `tools/write_inverse.py` refuses to run an inversion without `--obs-csv` and never synthesises a series. Label a `Bparameter=-1` run as `synthetic` in the validation tier, never as `real`."
  severity: warning
  stage: s11_inversion
  failure_domain: validation
  detection: "python3 tools/write_inverse.py --case c1 --algorithm trust_region --param ...   # blocks without --obs-csv"
  cross_references: [docs/s9_inversion_and_reliability.md, dt_021]

- id: dt_028
  name: stale files from a previous run are read as this run's input
  symptom: "A case that was edited and re-run produces the previous run's answer, or restarts unexpectedly from a state that does not belong to it."
  diagnosis: "HSTAR opens ~40 units in the working directory and leaves ~35 files behind. `*.rtt`, `*.oit`, `*.oip`, `*.ini`, `*.stf` and `*.ctt` are all read back on later runs when the corresponding flag is set. Re-running in place mixes generations of results silently."
  remedy: "Never run twice in the same directory. `tools/run_hstar.py` copies the case to a fresh temp workspace, runs there, and collects only the outputs; `tools/make_case.py` strips result files from a cloned template."
  severity: silent
  stage: s9_execution
  failure_domain: runtime
  detection: "ls -la case/ | grep -E '\\.(rtt|oit|oip|stf|ctt)$'"
  cross_references: [docs/s5_execution.md]

- id: dt_029
  name: "`water_level = -99.0` is a sentinel, not an elevation"
  symptom: "A model whose datum puts the reservoir surface near -99 m shows no uplift at all, with `upliftin=1` correctly set."
  diagnosis: "The shipped templates use `-99.000` in the `water_level` record to mean 'no reservoir in this run block'. The code treats that magic value as the disabled state rather than as an elevation."
  remedy: "Shift the mesh datum so no meaningful water level lands on -99, or use an offset elevation consistently. `tools/write_seepage.py --uplift` blocks a `--water-level` of exactly -99.0 and also checks it lies inside the mesh's vertical extent."
  severity: silent
  stage: s6_thermal_and_seepage
  failure_domain: configuration
  detection: "awk '/water_level/{getline; print}' case/1.glb"
  cross_references: [docs/s6_thermal_and_seepage.md]

- id: dt_030
  name: per-block repeats of .pre / .loa / .man missing after raising nblks
  symptom: "A staged run completes block 1 normally and then dies with `forrtl: severe (24): end-of-file` on unit 4, 21 or 9 at the start of block 2."
  diagnosis: "`.pre`, `.loa` and `.man` are each repeated ONCE PER RUN BLOCK, in block order (manual §3.5, §3.6, §3.8). Raising `nblks` in `.glb` without appending the extra block sections leaves the reader walking off the end of the file."
  remedy: "Change `nblks` and the block repeats together. `tools/write_stages.py --replicate` expands a single-block `.pre`/`.loa`/`.man` to `nblks` copies and then verifies the counts, refusing to finish if any file disagrees with `.glb`."
  severity: fatal
  stage: s8_contact_and_stages
  failure_domain: configuration
  detection: "grep -c 'PRESCRIBE SET' case/1.pre   # must equal nblks"
  cross_references: [docs/s8_contact_and_stages.md, dt_016]

- id: dt_031
  name: "prescribed non-zero value multiplied by a time curve of zero"
  symptom: "A prescribed surface temperature or support settlement is written correctly into `.pre` and the model behaves as if it were zero."
  diagnosis: "`val_fix` is a MULTIPLIER on the time curve named by `itcurve`, not an absolute value (manual §3.5 and thermal manual §3). If that curve evaluates to 0 at the current time — including the very common case of a `LINEAR` curve that starts at 0 — the prescribed value is 0 for that step."
  remedy: "For a constant prescribed value use a flat curve (times `0 1`, factors `1 1`) or `itcurve=0`. `tools/write_boundary.py` prints the curve id it wrote next to the value so the pairing is visible."
  severity: silent
  stage: s4_boundary_conditions
  failure_domain: configuration
  detection: "awk '/PRESCRIBE SET/{f=1} f' case/1.pre | head -3   # field 3 is itcurve"
  cross_references: [docs/s3_loads_and_bcs.md, dt_013]

- id: dt_032
  name: "PROFILE skyline solver chosen for a large 3-D model"
  symptom: "The run allocates many gigabytes and either thrashes or dies with `insufficient virtual memory`; `1.chk` reports a very large `length half stiff matrix`."
  diagnosis: "`type_solver='PROFILE'` stores the skyline of the stiffness matrix, whose size grows with the square of the bandwidth. `1.chk` prints `No. of equations` and `Max half band width` immediately before the factorisation, so the cost is predictable from the log of a short run."
  remedy: "Switch to `type_solver='PARDISO'` above roughly 5e4 degrees of freedom, and reduce the bandwidth with a better node numbering (`OPT.F90` `node_optimization`). `tools/set_analysis.py --solver PARDISO` sets it."
  severity: degraded
  stage: s3_analysis_control
  failure_domain: runtime
  detection: "grep -E 'No. of equations|half band width|length half stiff' case/1.chk"
  cross_references: [docs/s5_execution.md]
