# 100 m 重力坝 · 黏弹性人工边界 · 地震动力时程
#
# 对照：当前 deck 写法需要手工维护 1.glb / 1.man / 1.mat / 1.LOA / 1.pre / 1.ifs
# 六个文件、约 3000 行，其中 1.pre 的 62 个边界节点号和 1.ifs 的 85 条吸收边
# 全部靠手写或从别的算例抄。本文件 60 行，节点表与边表由几何导出并校验。

[case]
name   = "gravity-dam-100m-vie"
solver = "hstar-yl@26ffc9b"        # 求解器基线。schema 与它绑定,换基线要重新校验

[mesh]
source = "gmsh:dam-100m.geo"       # 或 files = { coords = "1.cor", elements = "1.ele" }

# ─────────────────────────────────────────────────────────────
# 材料：物理命名,没有 material_serial / MECHANICAL SOLID 这些槽位名
# ─────────────────────────────────────────────────────────────
[material.concrete]
model   = "elastic"
density = 2400                     # kg/m3
E       = 2.5e10                   # Pa
nu      = 0.2

[material.rock]
model   = "elastic"
density = 2600
E       = 1.0e10
nu      = 0.25

[material.water]
model     = "acoustic_fluid"
density   = 1000
bulk      = 2.2e9

# ─────────────────────────────────────────────────────────────
# 单元组：element 用类型名,不是 index=9 / index=25 这种魔数
# ─────────────────────────────────────────────────────────────
[[group]]
name = "foundation"; material = "rock";     element = "Q4"; region = "rock"
[[group]]
name = "dam";        material = "concrete"; element = "Q4"; region = "dam"
[[group]]
name = "reservoir";  material = "water";    element = "Q4"; region = "water"; field = "W"

# ─────────────────────────────────────────────────────────────
# 分析：和类型(tagged union)。kind 一旦选定,合法字段集就固定了
# ─────────────────────────────────────────────────────────────
[analysis]
kind = "dynamic"                   # static | modal | spectrum | dynamic | transient | frequency

[analysis.dynamic]
steps      = 1000
dt         = 0.02                  # s
mass       = "consistent"          # ← order_time 第 2 位。流体域自动保持 lumped
damping    = { alpha = 0.0, beta = 0.0 }

# ── 边界：又一层和类型。kind="viscoelastic" 才有 incident/absorbing 分支 ──
[analysis.dynamic.boundary]
kind = "viscoelastic"              # fixed | viscoelastic | mif
#
# 注意:本分支下 `excitation.acceleration` 这个字段【不存在】。
# 它只属于 kind="fixed"。所以 VIE 双重激励这个错误在本格式下无法表达。
# 源码依据见 02-facts-semantic-drift.md §1。

[analysis.dynamic.boundary.incident]
displacement = { x = "eq_disp_x.dat" }     # ← earthquake_curve_d
velocity     = { x = "eq_velo_x.dat" }     # ← earthquake_curve_v
datum        = "auto"                      # ← inpcord,默认取网格 y_min
direction    = "vertical_propagation"      # ← hwdirec

[analysis.dynamic.boundary.absorbing]
# 边由几何导出,不再手写节点/单元表。生成时校验:
#   bottom 的边必须全部落在 y_min 上;sides 必须全部落在 x_min/x_max 上;
#   覆盖必须完整,否则报错而不是静默漏掉。
bottom = { where = "y_min" }
sides  = { where = ["x_min", "x_max"] }
fluid  = { group = "reservoir" }   # ← nabsfgroup。有 W 场组而缺此项 → schema 报错
                                   #   (本会话建的 100m 坝正是漏了它,库水面全反射)

# ─────────────────────────────────────────────────────────────
# 约束与荷载
# ─────────────────────────────────────────────────────────────
[[constraint]]
where = "y_min"; fix = ["uy"]

[[load]]
kind = "gravity"; g = 9.81; direction = [0, -1]
groups = ["foundation", "dam"]     # ← tcurvegravity。未列出的组不施加重力
stage  = "static_preload"          # 重力在前置静力块施加,不进动力块
                                   #   (放进动力块会产生 491mm 竖向瞬态,实测)
