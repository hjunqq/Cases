# 钢筋混凝土粘结 —— 这是当前工具链【造不出来】的那个算例。
#
# 现状：train09_rc_bond 是 legacy_deck,人工写好的文件被重放,生成器从未产出过它。
# 生成器把 ikindks 写死为「有无 CONCRETE」二选一(3 或 0),而粘结需要 5;
# ftcrack 行写 8 字段而粘结需要 9;elem_index 25(钢桁架)被写成 1。
# 结果:0 字节输出,求解在第 1 步后停止。
#
# 本文件展示同一个算例在新格式下的样子。粘结是一个【显式的连接对象】,
# 不是某个数组的第 7 个魔数。

[case]
name   = "rc-beam-bond"
solver = "hstar-yl@26ffc9b"

[mesh]
files = { coords = "1.cor", elements = "1.ele" }

[material.concrete]
model    = "concrete_damage"       # ← 走 link_concrete_and_steel 那条 reader 路径
density  = 2400
E        = 2.8e10
nu       = 0.167
ft       = 1.5e6                   # 抗拉强度 Pa
fc       = 1.0e6

[material.steel]
model   = "elastic"
density = 150
E       = 2.0e11
nu      = 0.3

[material.truss_steel]
model   = "elastic"
density = 300
E       = 2.0e11
nu      = 0.3

[[group]]
name = "concrete";    material = "concrete";    element = "B8"
[[group]]
name = "rebar_off";   material = "steel";       element = "L2"; section = { area = 3.14e-4 }
[[group]]
name = "rebar_1";     material = "steel";       element = "L2"; section = { area = 3.14e-4 }
[[group]]
name = "steel_truss"; material = "truss_steel"; element = "truss"   # ← elem_index 25,不是 1

# ─────────────────────────────────────────────────────────────
# 粘结：一等公民的连接对象。
# 它一次性决定了 ikindks=5 / nlocalbeam=1 / ftcrack 的 9 字段布局——
# 这三样在 deck 里分散在三个地方,写对其中两个不会报错,只会算错。
# ─────────────────────────────────────────────────────────────
[[bond]]
model    = "steel_concrete"        # ← ikindks = 5
host     = "concrete"
embedded = ["rebar_off", "rebar_1", "steel_truss"]
local_beam = true                  # ← nlocalbeam = 1
tangent_stiffness = { k1 = 3.27e7, k2 = 3.27e7 }   # ← ktan1/ktan2,不是默认的 1.0e8
strength          = { tau_max = 1.5e6, residual = 1.0e6 }

[analysis]
kind = "static"

[analysis.static]
steps  = 10
solver = "pardiso"                 # ← 该算例人工要求 PARDISO,PROFILE 不收敛
tolerance = 1.0e-5

[[constraint]]
where = "support_nodes"; fix = ["ux", "uy", "uz"]

[[load]]
kind = "gravity"; g = 9.81; direction = [0, 0, -1]
groups = ["concrete", "rebar_1", "steel_truss"]     # rebar_off 不受重力(原 deck tcurvegravity = 1 0 1 1)
